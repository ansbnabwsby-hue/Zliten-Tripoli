<html lang="ar" dir="rtl">
<head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#00d4ff; --primary-dark:#0099cc; --secondary:#0077b6; --accent:#ff6b6b;
  --success:#2ecc71; --warning:#f39c12; --danger:#e74c3c;
  --dark:#0a0e27; --darker:#060818; --card:#111936; --card-hover:#1a2342;
  --text:#ffffff; --text-muted:#8b9bb4; --border:rgba(0,212,255,0.15);
  --glass:rgba(17,25,54,0.85); --gradient-1:linear-gradient(135deg,#00d4ff,#0077b6);
  --gradient-2:linear-gradient(135deg,#ff6b6b,#f39c12); --gradient-3:linear-gradient(135deg,#2ecc71,#1abc9c);
  --shadow-sm:0 2px 8px rgba(0,0,0,0.3); --shadow-md:0 4px 20px rgba(0,0,0,0.4); --shadow-glow:0 0 20px rgba(0,212,255,0.2);
}
:root.light {
  --dark:#f0f2f5; --darker:#e4e6eb; --card:#ffffff; --card-hover:#f5f6f8;
  --text:#1c1e21; --text-muted:#65676b; --border:rgba(0,0,0,0.1);
  --glass:rgba(255,255,255,0.9);
}
* { box-sizing:border-box; font-family:'Tajawal',sans-serif; -webkit-tap-highlight-color:transparent; outline:none; margin:0; padding:0; }
body { background:var(--darker); color:var(--text); min-height:100vh; overflow-x:hidden; line-height:1.6; transition:background 0.3s,color 0.3s; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:var(--dark); } ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:3px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideInRight { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
.animate-fade { animation:fadeIn 0.4s ease-out; } .animate-slide { animation:slideInRight 0.3s ease-out; }
.animate-pulse { animation:pulse 2s infinite; } .animate-float { animation:float 3s ease-in-out infinite; }
.btn { width:100%; padding:14px 20px; border-radius:16px; border:none; font-weight:700; font-size:0.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.3s cubic-bezier(0.4,0,0.2,1); color:white; position:relative; overflow:hidden; }
.btn::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0; border-radius:50%; background:rgba(255,255,255,0.2); transform:translate(-50%,-50%); transition:width 0.6s,height 0.6s; }
.btn:active::before { width:300px; height:300px; } .btn:active { transform:scale(0.96); }
.btn-primary { background:var(--gradient-1); box-shadow:0 4px 15px rgba(0,212,255,0.3); }
.btn-primary:hover { box-shadow:0 6px 25px rgba(0,212,255,0.5); transform:translateY(-2px); }
.btn-danger { background:var(--danger); } .btn-success { background:var(--gradient-3); }
.btn-warning { background:var(--gradient-2); color:#fff; }
.btn-outline { background:transparent; border:2px solid var(--primary); color:var(--primary); }
.btn-outline:hover { background:var(--primary); color:var(--dark); }
.btn-ghost { background:rgba(255,255,255,0.05); border:1px solid var(--border); }
.btn-ghost:hover { background:rgba(255,255,255,0.1); }
.btn-sm { padding:10px 16px; font-size:0.85rem; width:auto; } .btn-lg { padding:16px 24px; font-size:1.1rem; }
.card { background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all 0.3s ease; position:relative; overflow:hidden; }
.card::after { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gradient-1); opacity:0; transition:opacity 0.3s; }
.card:hover::after { opacity:1; } .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md),var(--shadow-glow); border-color:rgba(0,212,255,0.3); }
.card-gradient-1 { background:var(--gradient-1); border:none; } .card-gradient-2 { background:var(--gradient-2); border:none; } .card-gradient-3 { background:var(--gradient-3); border:none; }
input,textarea,select { width:100%; padding:14px 16px; margin:8px 0; border-radius:14px; border:2px solid var(--border); background:rgba(0,0,0,0.3); color:var(--text); font-size:0.95rem; transition:all 0.3s; }
input:focus,textarea:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,212,255,0.1); background:rgba(0,0,0,0.5); }
input::placeholder,textarea::placeholder { color:var(--text-muted); }
label { display:block; margin-top:12px; margin-bottom:4px; font-size:0.85rem; color:var(--text-muted); font-weight:500; }
header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; background:var(--glass); backdrop-filter:blur(20px); position:sticky; top:0; z-index:1000; border-bottom:1px solid var(--border); }
.logo-text { font-size:1.3rem; font-weight:900; background:var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; display:flex; align-items:center; gap:8px; }
.bottom-nav { position:fixed; bottom:0; width:100%; background:var(--glass); backdrop-filter:blur(20px); display:flex; justify-content:space-around; padding:8px 0 12px; border-top:1px solid var(--border); z-index:100; }
.nav-link { color:var(--text-muted); text-decoration:none; font-size:0.7rem; text-align:center; cursor:pointer; transition:all 0.3s; padding:6px 12px; border-radius:12px; position:relative; }
.nav-link i { font-size:1.4rem; display:block; margin-bottom:4px; transition:all 0.3s; }
.nav-link.active { color:var(--primary); transform:translateY(-5px); }
.nav-link.active i { text-shadow:0 0 15px var(--primary); transform:scale(1.1); }
.nav-link.active::before { content:''; position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); width:20px; height:3px; background:var(--primary); border-radius:2px; }
.badge { background:var(--danger); color:white; border-radius:50%; padding:2px 7px; font-size:0.7rem; position:absolute; top:-5px; right:-5px; font-weight:700; box-shadow:0 2px 8px rgba(231,76,60,0.4); }
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; backdrop-filter:blur(10px); padding:20px; }
.modal-content { background:var(--card); border:1px solid var(--border); width:100%; max-width:480px; padding:24px; border-radius:24px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-md); animation:fadeIn 0.3s ease-out; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.modal-title { color:var(--primary); font-size:1.2rem; font-weight:700; }
.modal-close { background:rgba(255,255,255,0.1); border:none; color:var(--text-muted); width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:1.2rem; transition:all 0.2s; }
.modal-close:hover { background:var(--danger); color:white; }
.img-preview { width:100%; max-height:200px; object-fit:cover; border-radius:16px; margin-top:10px; }
.store-avatar { width:80px; height:80px; border-radius:20px; object-fit:cover; background:var(--gradient-1); box-shadow:var(--shadow-sm); }
.product-img { width:70px; height:70px; border-radius:14px; object-fit:cover; box-shadow:var(--shadow-sm); }
.avatar-circle { width:50px; height:50px; border-radius:50%; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.2rem; flex-shrink:0; }
.rating-stars { color:var(--warning); letter-spacing:3px; font-size:1.1rem; }
.chat-bubble { padding:12px 16px; border-radius:20px; margin-bottom:10px; max-width:80%; word-break:break-word; font-size:0.95rem; line-height:1.5; position:relative; }
.bubble-left { background:var(--gradient-1); align-self:flex-start; border-bottom-right-radius:4px; }
.bubble-right { background:var(--card-hover); align-self:flex-end; border-bottom-left-radius:4px; border:1px solid var(--border); }
.bubble-system { background:transparent; color:var(--text-muted); align-self:center; font-size:0.75rem; text-align:center; }
.search-box { position:relative; margin-bottom:16px; }
.search-box input { padding-right:48px; margin:0; }
.search-box i { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
.category-pill { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:50px; background:rgba(0,212,255,0.1); border:1px solid var(--border); color:var(--primary); font-size:0.85rem; cursor:pointer; transition:all 0.3s; white-space:nowrap; }
.category-pill:hover,.category-pill.active { background:var(--primary); color:var(--dark); border-color:var(--primary); }
.categories-scroll { display:flex; gap:10px; overflow-x:auto; padding:4px; margin-bottom:20px; scrollbar-width:none; }
.categories-scroll::-webkit-scrollbar { display:none; }
.stat-card { background:var(--card); border-radius:16px; padding:16px; text-align:center; border:1px solid var(--border); transition:all 0.3s; }
.stat-card:hover { transform:translateY(-3px); }
.stat-value { font-size:1.8rem; font-weight:900; background:var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.stat-label { font-size:0.8rem; color:var(--text-muted); margin-top:4px; }
.status-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:50px; font-size:0.8rem; font-weight:600; }
.status-pending { background:rgba(243,156,18,0.2); color:var(--warning); }
.status-accepted { background:rgba(0,212,255,0.2); color:var(--primary); }
.status-delivery { background:rgba(46,204,113,0.2); color:var(--success); }
.status-done { background:rgba(46,204,113,0.2); color:var(--success); }
.progress-steps { display:flex; justify-content:space-between; position:relative; margin:24px 0; }
.progress-steps::before { content:''; position:absolute; top:15px; left:10%; right:10%; height:3px; background:var(--border); z-index:0; }
.step { display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:1; }
.step-circle { width:32px; height:32px; border-radius:50%; background:var(--card); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.8rem; transition:all 0.3s; }
.step.active .step-circle { background:var(--primary); border-color:var(--primary); box-shadow:0 0 15px rgba(0,212,255,0.4); }
.step.completed .step-circle { background:var(--success); border-color:var(--success); }
.step-label { font-size:0.7rem; color:var(--text-muted); }
.step.active .step-label { color:var(--primary); }
.toast-container { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
.toast { background:var(--card); border:1px solid var(--border); padding:14px 20px; border-radius:14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-md); animation:slideInRight 0.3s ease-out; pointer-events:all; min-width:280px; }
.toast-success { border-right:4px solid var(--success); } .toast-error { border-right:4px solid var(--danger); } .toast-warning { border-right:4px solid var(--warning); }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state i { font-size:4rem; margin-bottom:16px; opacity:0.5; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:8px; font-size:0.75rem; font-weight:600; }
.tag-primary { background:rgba(0,212,255,0.15); color:var(--primary); } .tag-success { background:rgba(46,204,113,0.15); color:var(--success); } .tag-warning { background:rgba(243,156,18,0.15); color:var(--warning); }
.wallet-card { background:var(--gradient-1); border-radius:24px; padding:24px; color:white; position:relative; overflow:hidden; margin-bottom:20px; }
.wallet-card::before { content:''; position:absolute; top:-50%; right:-20%; width:200px; height:200px; background:rgba(255,255,255,0.1); border-radius:50%; }
.wallet-balance { font-size:2.2rem; font-weight:900; margin:8px 0; } .wallet-label { font-size:0.9rem; opacity:0.9; }
	#app-content { padding:16px; max-width:600px; margin:0 auto; padding-bottom:100px; }
	#app-content > .animate-fade { contain:layout paint; }
	.card, .store-card, .address-card { content-visibility:auto; contain-intrinsic-size:120px; }
.loader-container { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:20px; }
.loader { width:60px; height:60px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
.fav-btn { background:none; border:none; color:var(--text-muted); font-size:1.3rem; cursor:pointer; transition:all 0.3s; padding:8px; }
.fav-btn.active { color:var(--danger); } .fav-btn:active { transform:scale(1.3); }
.coupon-card { background:linear-gradient(135deg,rgba(243,156,18,0.2),rgba(255,107,107,0.2)); border:2px dashed var(--warning); border-radius:16px; padding:16px; text-align:center; position:relative; overflow:hidden; }
.coupon-code { font-size:1.4rem; font-weight:900; letter-spacing:3px; color:var(--warning); margin:8px 0; }
.skeleton { background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
.toggle-switch { position:relative; width:50px; height:26px; background:var(--border); border-radius:13px; cursor:pointer; transition:all 0.3s; }
.toggle-switch.active { background:var(--primary); }
.toggle-switch::after { content:''; position:absolute; width:22px; height:22px; background:white; border-radius:50%; top:2px; right:2px; transition:all 0.3s; }
.toggle-switch.active::after { right:26px; }
.address-card { background:var(--card); border:2px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; cursor:pointer; transition:all 0.3s; position:relative; }
.address-card:hover { border-color:var(--primary); }
.address-card.selected { border-color:var(--primary); background:rgba(0,212,255,0.05); }
.address-card .addr-icon { width:40px; height:40px; border-radius:12px; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; color:white; font-size:1.1rem; }
.bot-msg { background:var(--card-hover); border:1px solid var(--border); border-radius:16px; padding:14px 18px; margin-bottom:10px; font-size:0.9rem; line-height:1.6; }
.bot-msg b { color:var(--primary); }
.report-btn { position:fixed; bottom:80px; left:16px; width:50px; height:50px; border-radius:50%; background:var(--danger); color:white; border:none; display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; box-shadow:var(--shadow-md); z-index:90; transition:all 0.3s; }
.report-btn:hover { transform:scale(1.1); }
.chart-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:6px; }
.chart-fill { height:100%; background:var(--gradient-1); border-radius:4px; transition:width 0.5s ease; }
.delivery-proof { border:2px dashed var(--border); border-radius:16px; padding:20px; text-align:center; cursor:pointer; transition:all 0.3s; }
.delivery-proof:hover { border-color:var(--primary); background:rgba(0,212,255,0.05); }
@media (max-width:400px) { .grid-2 { grid-template-columns:1fr; } .grid-3 { grid-template-columns:repeat(2,1fr); } .stat-value { font-size:1.4rem; } }
.hide-scroll::-webkit-scrollbar { display:none; } .hide-scroll { -ms-overflow-style:none; scrollbar-width:none; }
/* ===== تحسين شاشة الدخول ===== */
.auth-modern { margin-top:24px; padding:0; overflow:hidden; border:1px solid rgba(0,212,255,.28); background:linear-gradient(160deg,rgba(17,25,54,.98),rgba(6,8,24,.98)); }
.auth-hero { padding:28px 22px 24px; text-align:center; background:radial-gradient(circle at 50% 0%,rgba(0,212,255,.24),transparent 62%),linear-gradient(135deg,#101d4a,#071126); }
	.auth-logo-modern { width:82px;height:82px;border-radius:27px;margin:0 auto 15px;display:block;object-fit:cover;background:var(--gradient-1);box-shadow:0 12px 30px rgba(0,212,255,.3); }
.auth-hero h2 { font-size:1.75rem; margin-bottom:5px; color:#fff; }
.auth-hero p { color:#b6c7df; font-size:.88rem; }
.auth-form { padding:20px 20px 22px; }
.auth-label { display:block;color:#a9b8d1;font-size:.8rem;margin-top:9px;margin-bottom:5px; }
.auth-input-wrap { position:relative; }
.auth-input-wrap i { position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--primary); }
.auth-input-wrap input { padding-right:45px; }
.auth-type-title { color:#a9b8d1;font-size:.8rem;margin-top:12px; }
.auth-types { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 15px; }
.auth-type { width:100%;padding:11px 5px;border:1px solid var(--border);border-radius:13px;text-align:center;color:var(--text-muted);cursor:pointer;font-size:.75rem;transition:.2s;background:rgba(255,255,255,.03);appearance:none;-webkit-appearance:none; }
.auth-type.active { border-color:var(--primary);background:rgba(0,212,255,.12);color:var(--primary);box-shadow:0 0 0 2px rgba(0,212,255,.08); }
.auth-type i { display:block;font-size:1.25rem;margin-bottom:4px; }
.auth-type:active { transform:scale(.97); }
	.auth-hint { text-align:center;color:var(--text-muted);font-size:.74rem;margin-top:12px;line-height:1.7; }
	.brand-mark { width:34px;height:34px;border-radius:10px;object-fit:cover;vertical-align:middle;box-shadow:0 0 16px rgba(0,212,255,.28); }
	.section-toolbar { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px; }
	.section-toolbar h3 { margin:0; }
	.app-promo { background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(0,119,182,.12));border-color:rgba(0,212,255,.35); }
	.app-promo-logo { width:64px;height:64px;border-radius:18px;object-fit:cover;box-shadow:0 8px 20px rgba(0,212,255,.25); }
	.permission-row { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
@media(max-width:400px){.auth-types{gap:5px}.auth-type{font-size:.68rem}}

.live-map-card { padding:14px; }
	.live-map { height:260px; width:100%; border-radius:16px; overflow:hidden; background:#0b1730; border:1px solid var(--border); }
	.customer-map { height:220px; width:100%; border-radius:16px; overflow:hidden; background:#0b1730; border:1px solid var(--border); margin-top:10px; }
.live-map .leaflet-control-attribution { font-size:9px; }
.live-location-status { display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--text-muted);font-size:.8rem; }
.live-dot { width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(46,204,113,.14); }
.live-dot.waiting { background:var(--warning);box-shadow:0 0 0 4px rgba(243,156,18,.14); }
.live-privacy { margin-top:9px;color:var(--text-muted);font-size:.72rem;line-height:1.6; }

</style>

<body>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="sys-modal">
  <div class="modal-content">
    <div class="modal-header"><h3 class="modal-title" id="modal-title"></h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div id="modal-body" style="margin-bottom:15px;"></div>
    <div id="modal-inputs" style="margin-bottom:15px;"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end">
      <button id="modal-cancel" class="btn btn-danger btn-sm" style="display:none;">إلغاء</button>
      <button id="modal-ok" class="btn btn-primary btn-sm">حسناً</button>
    </div>
  </div>
</div>
<header id="main-header" style="display:none">
  <div class="logo-text" onclick="navigate('home')"><img src="icons/icon-192.png" class="brand-mark" alt="زلطن تريبول"> زلطن تريبول</div>

// ==================== Toast ====================
function showToast(message, type, duration) {
    type = type || 'success'; duration = duration || 3000;
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    let color = type === 'success' ? 'success' : type === 'error' ? 'danger' : 'warning';
    toast.innerHTML = '<i class="fas ' + icon + '" style="color:var(--' + color + ');font-size:1.2rem;"></i><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; toast.style.transform = 'translateX(100px)'; setTimeout(function() { toast.remove(); }, 300); }, duration);
}

function toggleQuickMenu() {
    let menu = document.getElementById('quick-menu');

function sync() {
    var payload = {
        users: db.users, stores: db.stores, orders: db.orders,
        chats: db.chats, reports: db.reports || [], ad: db.ad, policy: db.policy,
        coupons: db.coupons || [], faq: db.faq || [], categories: db.categories
    };
    database.ref('appData').set(payload).then(function() { cacheAppData(); }).catch(function(error) {
        if (error && error.code === 'PERMISSION_DENIED') showToast('تم التعديل محلياً، لكن Firebase رفض الحفظ لهذا الحساب', 'error', 5000);
        else showToast('تعذر حفظ التعديلات في قاعدة البيانات', 'error', 4000);
    });
}

function showModal(title, content, type, onConfirm, inputHtml) {
    type = type || 'alert';
    let modal = document.getElementById('sys-modal');
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-body').innerHTML = content;
    document.getElementById('modal-inputs').innerHTML = inputHtml || '';
    let btnOk = document.getElementById('modal-ok');
    let btnCancel = document.getElementById('modal-cancel');
    btnCancel.style.display = (type === 'confirm' || type === 'prompt') ? 'inline-flex' : 'none';
    modal.style.display = 'flex';
    btnOk.onclick = function() {
        closeModal();
        let inputVal = null;
        if (type === 'prompt') { let inp = document.getElementById('modal-input-field'); if(inp) inputVal = inp.value; }
        if (onConfirm) onConfirm(inputVal);
    };
    btnCancel.onclick = function() { closeModal(); };
}

function closeModal() { document.getElementById('sys-modal').style.display = 'none'; }

function encodeImage(input) {
    let file = input.files[0];
    if (file) {
        if (file.size > 2 * 1024 * 1024) { showToast('حجم الصورة كبير جداً (الحد الأقصى 2MB)', 'error'); return; }
        let reader = new FileReader();
        reader.onloadend = function() { tempImageBase64 = reader.result; };
        reader.readAsDataURL(file);
    }
}

function addNotification(userId, text, link) {
    link = link || '';
    let user = db.users.find(function(u) { return u.id === userId; });
    if (!user) return;
    if (!user.notifications) user.notifications = [];
    user.notifications.unshift({ id: Date.now().toString(), text: text, link: link, date: new Date().toLocaleString('ar-LY'), read: false });
    sync();
}

function notifyAllDrivers(text) {
    db.users.filter(function(u) { return u.type === 'driver'; }).forEach(function(d) { addNotification(d.id, text); });
}

// ==================== تحميل البيانات ====================
function dataArray(value) {
    if (Array.isArray(value)) return value;
    if (value && typeof value === 'object') return Object.keys(value).map(function(k) { return value[k]; }).filter(Boolean);
    return [];
}

function applyAppData(data) {
    if (!data || typeof data !== 'object') return false;
    db.users = dataArray(data.users); db.stores = dataArray(data.stores);
    db.orders = dataArray(data.orders); db.chats = dataArray(data.chats);
    db.reports = dataArray(data.reports); db.ad = data.ad || db.ad;
    db.policy = data.policy || db.policy; db.coupons = dataArray(data.coupons);
    db.faq = dataArray(data.faq); db.categories = dataArray(data.categories);
    db.orders.forEach(function(o) { if (!o.orderChat) o.orderChat = []; });
    return true;
}

function cacheAppData() {
    try { localStorage.setItem('z_appdata_cache', JSON.stringify({ users:db.users, stores:db.stores, orders:db.orders, chats:db.chats, reports:db.reports, ad:db.ad, policy:db.policy, coupons:db.coupons, faq:db.faq, categories:db.categories })); } catch (e) {}
}

function loadCachedAppData() {
    try { var cached = JSON.parse(localStorage.getItem('z_appdata_cache') || 'null'); return applyAppData(cached); } catch (e) { return false; }
}

function loadData() {
    if (!firebaseAuth.currentUser) { renderAuth(); return; }
    database.ref('appData').off();
    database.ref('appData').on('value', function(snap) {
        let data = snap.val();
        if (data) {
            applyAppData(data); cacheAppData();
        } else if (!loadCachedAppData()) {
            showToast('قاعدة البيانات متصلة لكن لا توجد بيانات appData بعد', 'warning', 5000);
        }
        checkAuth();
    }, function(error) {
        if (loadCachedAppData()) { checkAuth(); showToast('نعرض آخر نسخة محفوظة من المتاجر مؤقتاً', 'warning', 5000); }
        else renderDatabaseError(error);
    });
}

function renderDatabaseError(error) {
    var code = error && error.code ? error.code : 'unknown';
    var isPermission = code === 'PERMISSION_DENIED' || (error && String(error.message || '').toLowerCase().indexOf('permission') !== -1);
    if (isPermission && !firebaseAuth.currentUser) { renderAuth(); return; }
    var title = isPermission ? 'تعذر الوصول إلى البيانات' : 'تعذر الاتصال بقاعدة البيانات';
    var message = isPermission ? 'تم تسجيل الدخول، لكن قواعد Firebase لا تسمح لهذا الحساب بقراءة البيانات. راجع قواعد Realtime Database.' : 'تحقق من الإنترنت وإعدادات Firebase ثم حاول مرة أخرى.';
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('report-btn').style.display = 'none';
    document.getElementById('app-content').innerHTML = '<div class="animate-fade"><div class="card" style="text-align:center;border:2px solid var(--warning);margin-top:30px;">' +
        '<i class="fas ' + (isPermission ? 'fa-lock' : 'fa-cloud-slash') + ' fa-3x" style="color:var(--warning)"></i>' +
        '<h3 style="margin:14px 0;color:var(--warning)">' + title + '</h3><p style="color:var(--text-muted);line-height:1.8">' + message + '</p>' +
        '<button class="btn btn-primary" style="margin-top:16px" onclick="loadData()"><i class="fas fa-redo"></i> إعادة الاتصال</button>' +
        '<button class="btn btn-outline" style="margin-top:10px" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تغيير الحساب</button>' +
        '<small style="display:block;color:var(--text-muted);margin-top:14px">رمز الخطأ: ' + code + '</small></div></div>';
}

function checkAuth() {
    var authUser = firebaseAuth.currentUser;
    if (authUser) {
        var authEmail = (authUser.email || '').toLowerCase();
        var authProfile = db.users.find(function(u) { return u.authUid === authUser.uid || (u.email && u.email.toLowerCase() === authEmail); });
        if (!authProfile && authEmail === DEVELOPER_EMAIL) {
            authProfile = { id:'AUTH_' + authUser.uid, authUid:authUser.uid, name:'moad', email:authUser.email, pass:'', type:'developer', role:'developer', isDeveloper:true, phone:'', cashCollected:0, notifications:[], wallet:0, addresses:[], createdAt:new Date().toLocaleString('ar-LY'), avatar:'', bio:'', rating:0, ratingCount:0 };
            db.users.push(authProfile);
        }
        if (authProfile) { currentUser = authProfile; localStorage.setItem('z_user_id', authProfile.id); updateUI(); return; }
    }
    let savedId = localStorage.getItem('z_user_id');
    if (savedId && db.users.length) {
        let user = db.users.find(function(u) { return u.id === savedId; });
        if (user) { currentUser = user; updateUI(); return; }
    }
    renderAuth();
}

    let pass = document.getElementById('auth-pass').value;
    let type = document.getElementById('auth-type').value;
    let phone = document.getElementById('auth-phone') ? document.getElementById('auth-phone').value : '';
    if (!email || !pass) { showToast('أدخل البريد الإلكتروني وكلمة المرور', 'error'); return; }
    if (pass.length < 6) { showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error'); return; }
    firebaseAuth.signInWithEmailAndPassword(email, pass).then(function(result) {
        var authUser = result.user;
        var profile = db.users.find(function(u) { return u.authUid === authUser.uid || (u.email && u.email.toLowerCase() === email); });
        if (!profile && email === DEVELOPER_EMAIL) {
            profile = { id:'AUTH_' + authUser.uid, authUid:authUser.uid, name:'moad', email:email, pass:'', type:'developer', role:'developer', isDeveloper:true, phone:phone, cashCollected:0, notifications:[], wallet:0, addresses:[], createdAt:new Date().toLocaleString('ar-LY'), avatar:'', bio:'', rating:0, ratingCount:0 };
            db.users.push(profile); sync();
        }
        if (!profile) { showToast('تم تسجيل الدخول، لكن حسابك غير مربوط بملف مستخدم داخل التطبيق', 'warning', 5000); return; }
        currentUser = profile; localStorage.setItem('z_user_id', profile.id); updateUI(); database.ref('appData').off(); loadData();
    }).catch(function(error) {
        var message = error && (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential' || error.code === 'auth/invalid-login-credentials') ? 'البريد أو كلمة المرور غير صحيحة. تأكد من إنشاء الحساب في Firebase Authentication.' : error && error.code === 'auth/user-not-found' ? 'الحساب غير موجود. اضغط «إنشاء حساب جديد» أولاً.' : error && error.code === 'auth/too-many-requests' ? 'تم إيقاف المحاولات مؤقتاً. حاول لاحقاً أو أعد تعيين كلمة المرور.' : (error.message || 'تعذر تسجيل الدخول');
        showToast(message, 'error', 5000);
    });
}

function createFirebaseAccount() {
    var email = document.getElementById('auth-email').value.trim().toLowerCase();
    var pass = document.getElementById('auth-pass').value;
    var type = document.getElementById('auth-type').value;
    var phone = document.getElementById('auth-phone') ? document.getElementById('auth-phone').value : '';
    if (!email || !pass) { showToast('أدخل البريد وكلمة المرور لإنشاء الحساب', 'error'); return; }
    if (pass.length < 6) { showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error'); return; }
    firebaseAuth.createUserWithEmailAndPassword(email, pass).then(function(result) {
        var u = result.user;
        var developer = email === DEVELOPER_EMAIL;
        var profile = { id:'AUTH_' + u.uid, authUid:u.uid, name:developer ? 'moad' : email.split('@')[0], email:email, pass:'', type:developer ? 'developer' : type, role:developer ? 'developer' : type, isDeveloper:developer, phone:phone, cashCollected:0, notifications:[], wallet:0, addresses:[], createdAt:new Date().toLocaleString('ar-LY'), avatar:'', bio:'', rating:0, ratingCount:0 };
        db.users.push(profile); currentUser = profile; localStorage.setItem('z_user_id', profile.id); updateUI(); sync(); loadData();
        showToast('تم إنشاء الحساب وتسجيل الدخول بنجاح');
    }).catch(function(error) {
        var message = error && error.code === 'auth/email-already-in-use' ? 'هذا البريد مسجل مسبقاً. استخدم تسجيل الدخول.' : error && error.code === 'auth/invalid-email' ? 'صيغة البريد الإلكتروني غير صحيحة.' : error && error.code === 'auth/weak-password' ? 'كلمة المرور ضعيفة. استخدم 6 أحرف أو أكثر.' : (error.message || 'تعذر إنشاء الحساب');
        showToast(message, 'error', 5000);
    });
}

function renderSectionToolbar(title, icon, backPage) {

function shareApp() {

function installApp() {

}

    localStorage.setItem('z_favorites', JSON.stringify(favorites));
    navigate('home');
}

function selectStar(n) {
    selectedRating = n;
    let stars = document.querySelectorAll('#star-rating span');
    stars.forEach(function(s, i) { s.style.color = i < n ? 'var(--warning)' : 'rgba(255,255,255,0.2)'; });
}

function rateStore(storeId) {
    selectedRating = 0;
    showModal("⭐ تقييم المتجر", '<div style="text-align:center;padding:10px;"><p style="margin-bottom:15px;">كيف كانت تجربتك مع هذا المتجر؟</p><div style="font-size:2rem;letter-spacing:8px;cursor:pointer;" id="star-rating">' +
        '<span onclick="selectStar(1)">★</span><span onclick="selectStar(2)">★</span><span onclick="selectStar(3)">★</span><span onclick="selectStar(4)">★</span><span onclick="selectStar(5)">★</span></div>' +
        '<input id="rating-comment" placeholder="تعليقك (اختياري)" style="margin-top:15px;"></div>', 'confirm', function() {
        let val = selectedRating;
        let comment = document.getElementById('rating-comment') ? document.getElementById('rating-comment').value : '';
        if (val >= 1 && val <= 5) {
            let store = db.stores.find(function(s) { return s.id === storeId; });
            store.ratingSum = (store.ratingSum || 0) + val;
            store.ratingCount = (store.ratingCount || 0) + 1;
            if (!store.reviews) store.reviews = [];
            store.reviews.unshift({ user: currentUser.name, rating: val, comment: comment, date: new Date().toLocaleString('ar-LY') });
            sync(); showToast('شكراً لتقييمك! ⭐'); navigate('store', storeId);
        } else { showToast('الرجاء اختيار تقييم', 'error'); }
    });
}

function addToCart(sid, name, price, img) {
    cart.push({ sid: sid, name: name, price: price, img: img });
    updateCartBadge();
    showToast('تم إضافة ' + name + ' للسلة 🛒');
}

function renderAddresses(container) {
    let addrs = currentUser.addresses || [];
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">📍 عناويني</h3>' +
        '<button class="btn btn-primary btn-sm" style="margin-bottom:16px;width:auto;" onclick="openAddAddressModal()"><i class="fas fa-plus"></i> إضافة عنوان جديد</button>';
    if (!addrs.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-map-marker-alt"></i><p>لا توجد عناوين محفوظة</p></div>';
    } else {
        addrs.forEach(function(a, idx) {
            container.innerHTML += '<div class="address-card">' +
                '<div style="display:flex;align-items:center;gap:12px;">' +
                '<div class="addr-icon"><i class="fas fa-home"></i></div>' +
                '<div style="flex:1;"><b>' + (a.label || 'عنوان') + '</b><p style="color:var(--text-muted);font-size:0.9rem;margin:4px 0;">' + a.text + '</p></div>' +
                '<i class="fas fa-trash" style="color:var(--danger);cursor:pointer;padding:8px;" onclick="deleteAddress(' + idx + ')"></i></div></div>';
        });
    }
    container.innerHTML += '</div>';

function openAddAddressModal() {
    showModal("➕ إضافة عنوان", '<input id="addr-label" placeholder="اسم العنوان (مثال: البيت)"><textarea id="addr-text" placeholder="العنوان بالتفصيل"></textarea>', 'confirm', function() {
        let label = document.getElementById('addr-label').value;
        let text = document.getElementById('addr-text').value;
        if (!label || !text) return showToast('أدخل جميع البيانات', 'error');
        if (!currentUser.addresses) currentUser.addresses = [];
        currentUser.addresses.push({ label: label, text: text });
        let u = db.users.find(function(u) { return u.id === currentUser.id; });
        if (u) u.addresses = currentUser.addresses;
        sync(); showToast('تم إضافة العنوان'); navigate('addresses');
    });
}

function deleteAddress(idx) {
    showModal("حذف", "حذف هذا العنوان؟", "confirm", function() {
        currentUser.addresses.splice(idx, 1);
        let u = db.users.find(function(u) { return u.id === currentUser.id; });
        if (u) u.addresses = currentUser.addresses;
        sync(); navigate('addresses'); showToast('تم حذف العنوان');
    });
}

// ==================== السلة ====================
function getCurrentLocation(callback) {
    if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', 'error');
    showToast('جاري طلب إذن الموقع وتحديد مكانك...');
    navigator.geolocation.getCurrentPosition(
        function(pos) { currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }; updateCustomerMap(currentLocation); let el = document.getElementById('location-status'); if (el) el.innerHTML = '✅ تم تحديد موقعك بدقة ' + Math.round(pos.coords.accuracy) + 'م'; if (callback) callback(); },
        function(err) { let el = document.getElementById('location-status'); if (el) el.innerHTML = '⚠️ فعّل إذن الموقع من إعدادات الهاتف'; showToast('اسمح للتطبيق باستخدام موقعك من نافذة الأذونات', 'error', 5000); },
        { enableHighAccuracy:true, timeout:12000, maximumAge:30000 }
    );
}

let customerMap = null, customerMarker = null, customerAccuracyCircle = null;
function initCustomerMap() {
    var holder = document.getElementById('customer-map');
    if (!holder || typeof L === 'undefined') return;
    if (customerMap) { customerMap.remove(); customerMap = null; customerMarker = null; customerAccuracyCircle = null; }
    var fallback = [32.467, 14.568];
    var start = currentLocation ? [currentLocation.lat, currentLocation.lng] : fallback;
    customerMap = L.map(holder, { zoomControl:true, attributionControl:true }).setView(start, currentLocation ? 16 : 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(customerMap);
    if (currentLocation) updateCustomerMap(currentLocation);
    setTimeout(function(){ if (customerMap) customerMap.invalidateSize(); }, 200);
}
function updateCustomerMap(location) {
    if (!customerMap || !location) return;
    var point = [Number(location.lat), Number(location.lng)];
    if (!customerMarker) customerMarker = L.marker(point).addTo(customerMap).bindPopup('موقع التوصيل');
    else customerMarker.setLatLng(point);
    if (customerAccuracyCircle) customerAccuracyCircle.setLatLng(point).setRadius(Number(location.accuracy || 30));
    else customerAccuracyCircle = L.circle(point, { radius:Number(location.accuracy || 30), color:'#00d4ff', fillColor:'#00d4ff', fillOpacity:.12 }).addTo(customerMap);
    customerMap.setView(point, 16, { animate:true });
}

function renderCart(container) {
    if (!cart.length) {
        container.innerHTML = '<div style="text-align:center;margin-top:60px" class="animate-fade"><i class="fas fa-shopping-basket fa-4x" style="color:var(--primary)"></i><h3 style="margin:16px 0;">السلة فارغة</h3><button class="btn btn-primary" onclick="navigate(\'home\')">تصفح المتاجر</button></div>';
        return;
    }
    let total = cart.reduce(function(s, i) { return s + i.price; }, 0);
    let discount = 0;
    if (appliedCoupon) discount = Math.round(total * (appliedCoupon.discount / 100));
    let finalTotal = total - discount;
    let addrs = currentUser.addresses || [];
    let addrOptions = addrs.map(function(a, i) { return '<option value="' + i + '">' + a.label + ' - ' + a.text.substring(0, 30) + '</option>'; }).join('');

    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🛒 سلة المشتريات</h3>' +
        cart.map(function(item, idx) {
            return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;">' +
                '<div style="display:flex;align-items:center;gap:12px;">' +
                (item.img ? '<img src="' + item.img + '" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">' : '<div style="width:50px;height:50px;border-radius:10px;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;">📦</div>') +
                '<span>' + item.name + '</span></div>' +
                '<div style="display:flex;align-items:center;gap:12px;">' +
                '<span style="color:var(--success);font-weight:700;">' + item.price + ' د.ل</span>' +
                '<i class="fas fa-trash" style="color:var(--danger);cursor:pointer;" onclick="cart.splice(' + idx + ',1);updateCartBadge();navigate(\'cart\')"></i></div></div>';
        }).join('') +
        (appliedCoupon ? '<div class="card" style="background:rgba(46,204,113,0.1);border-color:var(--success);"><div style="display:flex;justify-content:space-between;align-items:center;"><span>🎟️ خصم (' + appliedCoupon.code + ')</span><span style="color:var(--success);font-weight:700;">-' + discount + ' د.ل</span></div></div>' : '') +
        '<div class="card card-gradient-1" style="text-align:center;font-size:1.3rem;font-weight:700;">الإجمالي: ' + finalTotal + ' د.ل</div>' +
        '<div class="card" style="padding:12px;">' +
        '<div style="display:flex;gap:8px;">' +
        '<input id="coupon-code" placeholder="أدخل كود الخصم" style="flex:1;margin:0;">' +
        '<button class="btn btn-sm btn-warning" onclick="applyCoupon()" style="width:auto;">تطبيق</button>' +
        '</div></div>' +
        '<label>📍 عنوان التوصيل</label>' +
        (addrOptions ? '<select id="addr-select" onchange="fillAddressFromSelect(this.value)"><option value="">اختر عنوان محفوظ...</option>' + addrOptions + '</select>' : '') +
        '<textarea id="order-address" placeholder="أو اكتب عنوان جديد..."></textarea>' +
        '<input id="order-phone" placeholder="رقم الهاتف" value="' + (currentUser.phone || '') + '">' +
        '<label>📝 ملاحظات إضافية للطلب <small>(اختياري)</small></label>' +
        '<textarea id="order-notes" placeholder="مثال: بدون شطة، بدون بصل، التوصيل أمام الباب..."></textarea>' +
        '<label>⏰ وقت التوصيل</label>' +
        '<select id="delivery-time"><option value="now">🚀 الآن (أسرع وقت)</option><option value="30">خلال 30 دقيقة</option><option value="60">خلال ساعة</option><option value="120">خلال ساعتين</option></select>' +
        '<div style="display:flex;gap:10px;align-items:center;margin:10px 0">' +
        '<button class="btn btn-outline btn-sm" style="width:auto;" onclick="getCurrentLocation()"><i class="fas fa-map-marker-alt"></i> تحديد موقعي</button>' +
        '<span id="location-status" style="color:var(--gray);"></span></div>' +
        '<div class="card" style="padding:10px;margin-top:8px;"><div style="font-size:.82rem;color:var(--text-muted);margin-bottom:6px;"><i class="fas fa-map-marked-alt"></i> موقعك على الخريطة</div><div id="customer-map" class="customer-map"></div></div>' +
        '<button class="btn btn-primary btn-lg" onclick="confirmOrder()"><i class="fas fa-paper-plane"></i> تأكيد الطلب</button></div>';
    setTimeout(initCustomerMap, 0);
}

function fillAddressFromSelect(val) {
    if (!val) return;
    let idx = parseInt(val);
    let addr = currentUser.addresses[idx];
    if (addr) document.getElementById('order-address').value = addr.text;
}

function applyCoupon() {
    let code = document.getElementById('coupon-code').value.trim().toUpperCase();
    if (!code) return;
    let coupon = db.coupons.find(function(c) { return c.code === code && c.active && usedCoupons.indexOf(code) === -1; });
    if (coupon) { appliedCoupon = coupon; showToast('تم تطبيق كود الخصم! خصم ' + coupon.discount + '% 🎉'); navigate('cart'); }
    else { showToast('كود غير صالح أو مستخدم', 'error'); }
}

function confirmOrder() {
    let addr = document.getElementById('order-address') ? document.getElementById('order-address').value : '';
    let phone = document.getElementById('order-phone') ? document.getElementById('order-phone').value : '';
    let notes = document.getElementById('order-notes') ? document.getElementById('order-notes').value.trim() : '';
    let time = document.getElementById('delivery-time') ? document.getElementById('delivery-time').value : 'now';
    if (!addr || !phone) return showToast('أدخل العنوان ورقم الهاتف', 'error');
    let storeId = cart[0].sid;
    let total = cart.reduce(function(s, i) { return s + i.price; }, 0);
    let discount = appliedCoupon ? Math.round(total * (appliedCoupon.discount / 100)) : 0;
    let order = {
        id: 'ORD' + Date.now(), userId: currentUser.id, userName: currentUser.name,
        storeId: storeId, items: JSON.parse(JSON.stringify(cart)), location: addr, phone: phone, notes: notes,
        status: 'قيد الانتظار ⏳', createdAt: new Date().toLocaleString('ar-LY'),
        driverId: null, coordinates: currentLocation, orderChat: [],
        coupon: appliedCoupon ? appliedCoupon.code : null, discount: discount, total: total - discount,
        deliveryTime: time, deliveryProof: null
    };
    db.orders.push(order);
    let store = db.stores.find(function(s) { return s.id === storeId; });
    if (store) addNotification(store.ownerId, 'طلب جديد من ' + currentUser.name, '');
    if (appliedCoupon) { usedCoupons.push(appliedCoupon.code); localStorage.setItem('z_used_coupons', JSON.stringify(usedCoupons)); }
    cart = []; appliedCoupon = null; currentLocation = null;
    sync(); showToast('تم إرسال الطلب بنجاح! 🎉'); navigate('orders');
}

function renderOrders(container) {
    let myOrders = db.orders.filter(function(o) { return o.userId === currentUser.id; }).reverse();
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">📋 طلباتي</h3>';
    if (!myOrders.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-box-open"></i><p>لا توجد طلبات بعد</p><button class="btn btn-primary btn-sm" onclick="navigate(\'home\')">تصفح المتاجر</button></div></div>';
        return;
    }
    myOrders.forEach(function(o) {
        let statusClass = o.status.indexOf('انتظار') !== -1 ? 'status-pending' : o.status.indexOf('قبول') !== -1 ? 'status-accepted' : o.status.indexOf('توصيل') !== -1 ? 'status-delivery' : 'status-done';
        let timeLabel = o.deliveryTime === 'now' ? '⚡ الآن' : o.deliveryTime === '30' ? '⏰ 30 دقيقة' : o.deliveryTime === '60' ? '⏰ ساعة' : '⏰ ساعتين';
        container.innerHTML += '<div class="card animate-fade">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<b>#' + o.id.slice(-6) + '</b>' +
            '<span class="status-badge ' + statusClass + '">' + o.status + '</span></div>' +
            '<div style="color:var(--text-muted);font-size:0.85rem;">' + o.createdAt + ' • ' + timeLabel + '</div>' +
            '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn btn-sm btn-outline" onclick="navigate(\'track\',\'' + o.id + '\')"><i class="fas fa-map-marked-alt"></i> تتبع</button>' +
            (o.status.indexOf('تسليم') !== -1 && !o.driverRated ? '<button class="btn btn-sm btn-warning" onclick="rateDriver(\'' + o.id + '\')"><i class="fas fa-star"></i> تقييم السائق</button>' : '') +
            '</div></div>';
    });
    container.innerHTML += '</div>';
}

function rateDriver(orderId) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order || !order.driverId) return;
    selectedRating = 0;
    showModal("⭐ تقييم السائق", '<div style="text-align:center;padding:10px;"><p>قيم أداء السائق</p><div style="font-size:2rem;letter-spacing:8px;cursor:pointer;" id="star-rating">' +
        '<span onclick="selectStar(1)">★</span><span onclick="selectStar(2)">★</span><span onclick="selectStar(3)">★</span><span onclick="selectStar(4)">★</span><span onclick="selectStar(5)">★</span></div>' +
        '<input id="driver-rating-comment" placeholder="تعليقك (اختياري)" style="margin-top:15px;"></div>', 'confirm', function() {
        if (selectedRating > 0) {
            let driver = db.users.find(function(u) { return u.id === order.driverId; });
            if (driver) {
                driver.rating = (driver.rating || 0) + selectedRating;
                driver.ratingCount = (driver.ratingCount || 0) + 1;
            }
            order.driverRated = true;
            let comment = document.getElementById('driver-rating-comment') ? document.getElementById('driver-rating-comment').value : '';
            order.driverReview = { rating: selectedRating, comment: comment, date: new Date().toLocaleString('ar-LY') };
            sync(); showToast('شكراً لتقييم السائق! ⭐'); navigate('orders');
        } else { showToast('الرجاء اختيار تقييم', 'error'); }
    });
}

// ==================== لوحة التاجر مع التحليلات ====================
function renderStoreOwnerPanel(container) {
    let myStore = db.stores.find(function(s) { return s.ownerId === currentUser.id; });
    if (!myStore) {
        container.innerHTML = '<div class="animate-fade"><div class="card" style="text-align:center">' +
            '<div style="font-size:3rem;margin-bottom:16px;">🏪</div><h3>أنشئ متجرك الآن</h3>' +
            '<input id="new-store-name" placeholder="اسم المتجر">' +
            '<label>التصنيف</label><select id="new-store-cat">' +
            db.categories.filter(function(c) { return c.id !== 'all'; }).map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('') + '</select>' +
            '<label>صورة المتجر (اختياري)</label><input type="file" onchange="encodeImage(this)" accept="image/*">' +
            '<button class="btn btn-success" onclick="createMyStore()"><i class="fas fa-plus"></i> إنشاء المتجر</button></div></div>';
        return;
    }
    let storeOrders = db.orders.filter(function(o) { return o.storeId === myStore.id; }).reverse();
    let totalRevenue = storeOrders.filter(function(o) { return o.status.indexOf('تسليم') !== -1; }).reduce(function(s, o) { return s + (o.total || 0); }, 0);
    let pendingCount = storeOrders.filter(function(o) { return o.status.indexOf('انتظار') !== -1; }).length;
    let todayOrders = storeOrders.filter(function(o) { return o.createdAt && o.createdAt.indexOf(new Date().toLocaleDateString('ar-LY')) !== -1; });
    let weekOrders = storeOrders.filter(function(o) { return o.createdAt && new Date().getTime() - new Date(o.createdAt).getTime() < 7 * 24 * 60 * 60 * 1000; });

    // Analytics chart data
    let dailySales = {};
    storeOrders.filter(function(o) { return o.status.indexOf('تسليم') !== -1; }).forEach(function(o) {
        let d = o.createdAt ? o.createdAt.split(' ')[0] : 'غير معروف';
        dailySales[d] = (dailySales[d] || 0) + (o.total || 0);
    });
    let chartDays = Object.keys(dailySales).slice(-7);
    let maxSale = Math.max.apply(null, Object.values(dailySales).concat([1]));
    let chartHtml = chartDays.map(function(d) {
        let pct = Math.round((dailySales[d] / maxSale) * 100);
        return '<div style="flex:1;text-align:center;"><div style="height:80px;display:flex;align-items:flex-end;justify-content:center;"><div style="width:20px;background:var(--gradient-1);border-radius:4px 4px 0 0;height:' + pct + '%;transition:height 0.5s;"></div></div><div style="font-size:0.65rem;color:var(--text-muted);margin-top:4px;">' + d + '</div></div>';
    }).join('');

    let ordersHtml = storeOrders.slice(0, 10).map(function(o) {
        return '<div class="card">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<b>' + o.userName + '</b><span class="status-badge ' + (o.status.indexOf('انتظار') !== -1 ? 'status-pending' : o.status.indexOf('قبول') !== -1 ? 'status-accepted' : o.status.indexOf('توصيل') !== -1 ? 'status-delivery' : 'status-done') + '">' + o.status + '</span></div>' +
            '<small style="color:var(--text-muted)">' + o.items.map(function(i){return i.name;}).join(', ') + '</small><br>' +
            '<small>📍 ' + o.location + ' | 📞 ' + o.phone + '</small>' +
            (o.status === 'قيد الانتظار ⏳' ? '<button class="btn btn-sm btn-success" style="margin-top:8px" onclick="acceptOrder(\'' + o.id + '\')"><i class="fas fa-check"></i> قبول الطلب</button>' : '') +
            '<button class="btn btn-sm btn-outline" style="margin-top:5px" onclick="navigate(\'track\',\'' + o.id + '\')"><i class="fas fa-eye"></i> تتبع</button></div>';
    }).join('');

    let productsHtml = (myStore.products || []).map(function(p) {
        return '<div class="card" style="display:flex;justify-content:space-between;align-items:center">' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
            (p.img ? '<img src="' + p.img + '" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">' : '<div style="width:50px;height:50px;border-radius:10px;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;">📦</div>') +
            '<span><b>' + p.name + '</b><br><span style="color:var(--success)">' + p.price + ' د.ل</span></span></div>' +
            '<div style="display:flex;gap:8px">' +
            '<i class="fas fa-edit" style="color:var(--warning);cursor:pointer;" onclick="editProduct(\'' + p.id + '\')"></i>' +
            '<i class="fas fa-trash" style="color:var(--danger);cursor:pointer;" onclick="deleteProduct(\'' + p.id + '\')"></i></div></div>';
    }).join('');

    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🏪 ' + myStore.name + '</h3>' +
        '<div class="grid-2" style="margin-bottom:16px;">' +
        '<div class="stat-card"><div class="stat-value">' + totalRevenue + '</div><div class="stat-label">💰 إجمالي المبيعات</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + pendingCount + '</div><div class="stat-label">⏳ طلبات معلقة</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + todayOrders.length + '</div><div class="stat-label">📅 طلبات اليوم</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + weekOrders.length + '</div><div class="stat-label">📊 هذا الأسبوع</div></div></div>' +
        '<div class="card"><h4 style="margin-bottom:12px;">📈 المبيعات اليومية (آخر 7 أيام)</h4><div style="display:flex;gap:8px;align-items:flex-end;height:100px;">' + (chartHtml || '<p style="color:var(--text-muted)">لا بيانات كافية</p>') + '</div></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px">' +
        '<button class="btn btn-sm btn-primary" onclick="openAddProductModal(\'' + myStore.id + '\')"><i class="fas fa-plus"></i> إضافة منتج</button>' +
        '<button class="btn btn-sm btn-outline" onclick="toggleStoreOpen()"><i class="fas ' + (myStore.isOpen === false ? 'fa-lock' : 'fa-lock-open') + '"></i> ' + (myStore.isOpen === false ? 'فتح المتجر' : 'إغلاق المتجر') + '</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteMyStore()"><i class="fas fa-trash"></i> حذف</button></div>' +
        '<h4>📦 منتجاتي (' + (myStore.products ? myStore.products.length : 0) + ')</h4>' + (productsHtml || '<p style="color:var(--text-muted)">لا توجد منتجات</p>') +
        '<h4 style="margin-top:20px;">📥 طلبات المتجر (' + storeOrders.length + ')</h4>' + (ordersHtml || '<p style="color:var(--text-muted)">لا طلبات بعد</p>') +
        '<button class="btn btn-outline btn-sm" style="margin-top:15px" onclick="navigate(\'home\')">العودة للرئيسية</button></div>';
}

function toggleStoreOpen() {
    let myStore = db.stores.find(function(s) { return s.ownerId === currentUser.id; });
    if (myStore) { myStore.isOpen = myStore.isOpen === false ? true : false; sync(); showToast(myStore.isOpen === false ? 'تم إغلاق المتجر 🔒' : 'تم فتح المتجر 🔓'); navigate('my-store'); }
}

function deleteMyStore() {
    showModal("تأكيد الحذف", "هل أنت متأكد من حذف متجرك نهائياً؟", "confirm", function() {
        db.stores = db.stores.filter(function(s) { return s.ownerId !== currentUser.id; });
        sync(); navigate('my-store'); showToast('تم حذف المتجر');
    });
}

function editProduct(productId) {
    let store = db.stores.find(function(s) { return s.ownerId === currentUser.id; });
    let product = store.products.find(function(p) { return p.id === productId; });
    if (!product) return;

// ==================== التتبع الحي لموقع السائق ====================
function stopLiveLocationTracking(removeRemote) {
    if (activeLocationWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(activeLocationWatchId);
    }
    activeLocationWatchId = null;
    activeLocationOrderId = null;
    if (liveLocationRef && liveLocationListener) liveLocationRef.off('value', liveLocationListener);
    liveLocationRef = null;
    liveLocationListener = null;
    if (removeRemote && liveMapOrderId) database.ref('liveLocations/' + liveMapOrderId).remove().catch(function(){});
}

function formatLocationTime(value) {
    if (!value) return 'بانتظار موقع السائق';
    try { return 'آخر تحديث: ' + new Date(value).toLocaleTimeString('ar-LY'); } catch(e) { return 'تم تحديث الموقع'; }
}

function updateLiveMap(location) {
    if (!location || !location.lat || !location.lng) return;
    var point = [Number(location.lat), Number(location.lng)];
    if (liveMarker) liveMarker.setLatLng(point);
    else if (liveMap) liveMarker = L.marker(point).addTo(liveMap).bindPopup('موقع السائق');
    if (liveMap) {
        if (!liveMap._hasDriverLocation) { liveMap.setView(point, 16); liveMap._hasDriverLocation = true; }
        else liveMap.panTo(point, { animate:true, duration:.5 });
    }
    var status = document.getElementById('live-location-status');
    if (status) status.innerHTML = '<span class="live-dot"></span><span>السائق متصل • ' + formatLocationTime(location.updatedAt) + (location.accuracy ? ' • دقة ' + Math.round(location.accuracy) + 'م' : '') + '</span>';
}

function initLiveMap(orderId, isDriver) {
    var holder = document.getElementById('live-map-' + orderId);
    if (!holder || typeof L === 'undefined') return;
    if (liveMap) { liveMap.remove(); liveMap = null; liveMarker = null; }
    liveMapOrderId = orderId;
    liveMap = L.map(holder, { zoomControl:true, attributionControl:true }).setView([32.467, 14.568], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(liveMap);
    if (isDriver) {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>جاري طلب إذن الموقع من الهاتف...</span>';
    }
    setTimeout(function(){ if (liveMap) liveMap.invalidateSize(); }, 250);
}

function startDriverLocationSharing(orderId) {
    if (!navigator.geolocation) {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>الموقع غير مدعوم على هذا الجهاز</span>';
        return;
    }
    if (activeLocationOrderId === orderId && activeLocationWatchId !== null) return;
    stopLiveLocationTracking(false);
    activeLocationOrderId = orderId;
    activeLocationWatchId = navigator.geolocation.watchPosition(function(pos) {
        var trackedOrder = db.orders.find(function(o) { return o.id === orderId; });
        var trackedStore = trackedOrder ? db.stores.find(function(s) { return s.id === trackedOrder.storeId; }) : null;
        var payload = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy || null, updatedAt: Date.now(), driverId: currentUser.id, driverName: currentUser.name, customerId: trackedOrder ? trackedOrder.userId : null, storeOwnerId: trackedStore ? trackedStore.ownerId : null };
        database.ref('liveLocations/' + orderId).set(payload).catch(function(){ showToast('تعذر تحديث موقعك حالياً', 'error', 2500); });
        updateLiveMap(payload);
    }, function() {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>يرجى السماح للتطبيق بالوصول إلى موقعك</span>';
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
}

function subscribeToDriverLocation(orderId) {
    if (liveLocationRef && liveLocationListener) liveLocationRef.off('value', liveLocationListener);
    liveLocationRef = database.ref('liveLocations/' + orderId);
    liveLocationListener = function(snapshot) {
        var location = snapshot.val();
        updateLiveMap(location);
        var status = document.getElementById('live-location-status');
        if (!location && status) status.innerHTML = '<span class="live-dot waiting"></span><span>بانتظار مشاركة موقع السائق...</span>';
    };
    liveLocationRef.on('value', liveLocationListener);
}

        '<div class="card">' +
        '<h4 style="margin-bottom:12px;">💬 دردشة الطلب (مشتركة)</h4>' +

function goBackFromOrder() {
    if (!currentUser) return renderAuth();
    if (currentUser.type === 'driver') return navigate('driver');
    if (currentUser.type === 'store_owner') return navigate('my-store');
    return navigate('orders');
}

function sendTrackMsg(orderId) {
    let inp = document.getElementById('track-msg-input');
    if (!inp.value.trim()) return;
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order.orderChat) order.orderChat = [];
    order.orderChat.push({ sender: currentUser.id, text: inp.value.trim() });
    let store = db.stores.find(function(s) { return s.id === order.storeId; });
    if (order.userId !== currentUser.id) addNotification(order.userId, 'رسالة جديدة في الطلب #' + orderId.slice(-6));
    if (store && store.ownerId !== currentUser.id) addNotification(store.ownerId, 'رسالة جديدة في الطلب #' + orderId.slice(-6));
    if (order.driverId && order.driverId !== currentUser.id) addNotification(order.driverId, 'رسالة جديدة في الطلب #' + orderId.slice(-6));
    sync(); navigate('track', orderId);
}

        return '<div class="card animate-fade" style="padding:10px;' + (n.read ? 'opacity:0.6' : '') + '" onclick="markNotifRead(\'' + n.id + '\')">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +

function markNotifRead(id) {
    let notif = currentUser.notifications.find(function(n) { return n.id === id; });
    if (notif) notif.read = true;
    let u = db.users.find(function(u) { return u.id === currentUser.id; });
    if (u) u.notifications = currentUser.notifications;
    sync(); updateNotifyBadge(); navigate('mail');
}

function markAllNotifRead() {
    currentUser.notifications.forEach(function(n) { n.read = true; });
    sync(); updateNotifyBadge(); navigate('mail'); showToast('تم تعليم جميع الإشعارات كمقروءة');
}

function sendMsg(cid) {

function toggleFaq(i) {

    let icon = document.getElementById('faq-icon-' + i);

function sendSupportMsg() {
    let inp = document.getElementById('support-input');
    if (!inp.value.trim()) return;
    let chat = document.getElementById('support-chat');
    chat.innerHTML += '<div class="chat-bubble bubble-left" style="align-self:flex-end;"><b>أنت:</b> ' + inp.value + '</div>';

    setTimeout(function() {

function getBotReply(msg) {
    msg = msg.toLowerCase();
    if (msg.indexOf('طلب') !== -1 || msg.indexOf('order') !== -1) return 'للطلب: اختر المتجر، أضف المنتجات للسلة، ثم أكد الطلب.';
    if (msg.indexOf('سائق') !== -1 || msg.indexOf('driver') !== -1) return 'للتسجيل كسائق: سجل حسابك كسائق ثم فعل وضع السائق من قائمة التوصيل.';
    if (msg.indexOf('متجر') !== -1 || msg.indexOf('store') !== -1) return 'لفتح متجر: سجل كتاجر ثم اضغط على متجري في القائمة.';
    if (msg.indexOf('توصيل') !== -1 || msg.indexOf('delivery') !== -1) return 'مدة التوصيل تتراوح بين 15-45 دقيقة حسب المسافة.';
    if (msg.indexOf('خصم') !== -1 || msg.indexOf('كوبون') !== -1 || msg.indexOf('coupon') !== -1) return 'يمكنك الحصول على كوبونات خصم من قسم الكوبونات في الصفحة الرئيسية.';
    if (msg.indexOf('سلام') !== -1 || msg.indexOf('أهلا') !== -1 || msg.indexOf('مرحبا') !== -1) return 'أهلاً وسهلاً! 🎉 كيف يمكنني مساعدتك؟';
    return 'شكراً لتواصلك! إذا لم تجب إجابتك هنا، يمكنك استخدام زر الإبلاغ للتواصل مع الإدارة.';
}

function devAddCoupon() {

function devRefreshProductsList() {
    let select = document.getElementById('dev-store-select');
    if (!select) return;
    let storeId = select.value;
    let store = db.stores.find(function(s) { return s.id === storeId; });
    let listDiv = document.getElementById('dev-products-list');
    if (store && store.products) {
        listDiv.innerHTML = store.products.map(function(p) {
            return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:8px;">' +
                '<span>' + p.name + ' - ' + p.price + ' د.ل</span>' +

                '<i class="fas fa-edit" style="color:var(--warning);cursor:pointer;" onclick="devEditProduct(\'' + storeId + '\', \'' + p.id + '\')"></i>' +
                '<i class="fas fa-trash" style="color:var(--danger);cursor:pointer;" onclick="devDeleteProduct(\'' + storeId + '\', \'' + p.id + '\')"></i></div></div>';
        }).join('');
    } else listDiv.innerHTML = '<p>لا توجد منتجات</p>';

function devEditProduct(storeId, productId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    let product = store.products.find(function(p) { return p.id === productId; });
    if (!product) return;
    tempImageBase64 = product.img || '';
    showModal("✏️ تعديل منتج", '<input id="dev-edit-name" value="' + product.name + '" placeholder="اسم المنتج"><input id="dev-edit-price" type="number" value="' + product.price + '" placeholder="السعر"><label>صورة جديدة (اختياري)</label><input type="file" accept="image/*" onchange="encodeImage(this)">', 'confirm', function() {
        let newName = document.getElementById('dev-edit-name') ? document.getElementById('dev-edit-name').value : '';
        let newPrice = document.getElementById('dev-edit-price') ? document.getElementById('dev-edit-price').value : '';
        if (!newName || !newPrice) return showToast('الرجاء إدخال الاسم والسعر', 'error');
        product.name = newName; product.price = parseInt(newPrice);
        if (tempImageBase64) product.img = tempImageBase64;
        sync(); devRefreshProductsList(); showToast('تم تعديل المنتج');
    });
}

function devDeleteProduct(storeId, productId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    store.products = store.products.filter(function(p) { return p.id !== productId; });
    sync(); devRefreshProductsList(); showToast('تم حذف المنتج');
}
