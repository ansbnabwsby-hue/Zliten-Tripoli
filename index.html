<style>

* { box-sizing:border-box; font-family:'Tajawal',sans-serif; -webkit-tap-highlight-color:transparent; outline:none; margin:0; padding:0; }
 body { background:var(--darker); color:var(--text); min-height:100vh; overflow-x:hidden; line-height:1.6; transition:background-color 0.18s,color 0.18s; }

function showToast(message, type, duration) {
    type = type || 'success'; duration = duration || 3000;
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    let color = type === 'success' ? 'success' : type === 'error' ? 'danger' : 'warning';
    toast.innerHTML = '<i class="fas ' + icon + '" style="color:var(--' + color + ');font-size:1.2rem;"></i><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; toast.style.transform = 'translateX(100px)'; setTimeout(function() { toast.remove(); }, 300); }, duration);
}

function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char];

}

    return Array.isArray(chat && chat.msgs) ? chat.msgs.filter(function(message) { return message && typeof message === 'object'; }) : dataArray(chat && chat.msgs);
}

function getChatLastMessage(chat) {
    var messages = getChatMessages(chat);
    return messages.length ? messages[messages.length - 1] : null;
}

function getChatTimestamp(chat) {
    var last = getChatLastMessage(chat);
    return Number((chat && chat.lastMessageAt) || (last && last.ts)) || 0;
}

function sync() {
    if (!firebaseAuth.currentUser || !firebaseDataLoaded || !firebaseConnected) {
        showToast(!firebaseConnected ? 'الحفظ متوقف حتى عودة الاتصال بقاعدة البيانات.' : 'انتظر اكتمال تحميل بيانات Firebase قبل الحفظ', 'warning', 3500);
        return Promise.resolve(false);
    }
    var payload = {
        users: db.users, stores: db.stores, orders: db.orders,
        chats: db.chats, reports: db.reports || [], ad: db.ad, policy: db.policy,
        coupons: db.coupons || [], faq: db.faq || [], categories: db.categories
    };
    syncPendingCount++;
    updateDeveloperConnectionBadge();
    var write = pendingSync.catch(function() {}).then(function() {
        if (!firebaseConnected) { var disconnected = new Error('Firebase disconnected'); disconnected.code = 'NETWORK_DISCONNECTED'; throw disconnected; }
        return database.ref('appData').update(payload);
    });
    pendingSync = write.catch(function() {});
    return write.then(function() { cacheAppData(); syncPendingCount = Math.max(0, syncPendingCount - 1); updateDeveloperConnectionBadge(); return true; }).catch(function(error) {
        syncPendingCount = Math.max(0, syncPendingCount - 1);
        updateDeveloperConnectionBadge();
        if (error && error.code === 'PERMISSION_DENIED') showToast('رفضت قواعد Firebase حفظ التعديل لهذا الحساب؛ لا تعتبره محفوظاً حتى تُراجع صلاحيات قاعدة البيانات.', 'error', 6000);
        else showToast('تعذر حفظ التعديلات في قاعدة البيانات', 'error', 4000);
        return false;
    });
}

function addNotification(userId, text, link, deferSync) {

// ==================== تحميل البيانات ====================
function dataArray(value) {
    if (Array.isArray(value)) return value;
    if (value && typeof value === 'object') return Object.keys(value).map(function(k) { return value[k]; }).filter(Boolean);
    return [];
}

function userRecordArray(value) {
    if (Array.isArray(value)) {
        return value.map(function(user, index) {
            if (!user || typeof user !== 'object') return null;
            var copy = Object.assign({}, user);
            return copy;
        }).filter(Boolean);
    }
    if (!value || typeof value !== 'object') return [];
    return Object.keys(value).map(function(key) {
        var user = value[key];
        if (!user || typeof user !== 'object') return null;
        var copy = Object.assign({}, user);
        if (!copy.id) copy.id = key;
        return copy;
    }).filter(Boolean);
}

function stableUserId(user, index) {
    var seed = user.authUid ? 'uid:' + String(user.authUid).trim().toLowerCase() :
        (user.email || user.authEmail) ? 'email:' + String(user.email || user.authEmail).trim().toLowerCase() :
        user.loginName ? 'login:' + String(user.loginName).trim().toLowerCase() :
        user.phone ? 'phone:' + String(user.phone).replace(/\s+/g, '') + '|' + String(user.createdAt || user.name || '') :
        user.createdAt ? 'created:' + String(user.createdAt) + '|' + String(user.name || '') :
        user.name ? 'legacy-name:' + String(user.name).trim().toLowerCase() + '|' + String(user.type || '') :
        'legacy-index:' + index;
    var hash = 0;
    for (var i = 0; i < seed.length; i++) hash = ((hash << 5) - hash + seed.charCodeAt(i)) | 0;
    return 'USR_' + Math.abs(hash).toString(36).toUpperCase();
}

function ensureUserIds(value) {
    var used = {}, records = userRecordArray(value);
    return records.map(function(user, index) {
        var id = user.id ? String(user.id).trim() : '';
        if (!id || used[id]) {
            id = stableUserId(user, index);
            while (used[id]) id = id + '_' + index;
        }
        user.id = id;
        used[id] = true;
        return user;
    });
}

function announceIncomingNotifications(previousUsers) {
    if (!currentUser || currentUser.type !== 'driver') return;
    var previous = (dataArray(previousUsers).find(function(u) { return u && u.id === currentUser.id; }) || {}).notifications || [];
    var current = currentUser.notifications || [];
    var oldIds = {};
    previous.forEach(function(n) { if (n && n.id) oldIds[String(n.id)] = true; });
    current.slice(0, 8).forEach(function(n) {
        if (!n || !n.id || oldIds[String(n.id)] || seenNotificationIds[String(n.id)]) return;
        seenNotificationIds[String(n.id)] = true;
        showToast('🔔 ' + (n.text || 'لديك إشعار جديد'), 'info', 6500);
        sendLocalNotification('طلب جديد في زلطن تريبول', n.text || 'لديك إشعار جديد');
    });
}

function uniqueUserRecords(users) {
    var result = [], aliases = {};
    ensureUserIds(users).forEach(function(user) {
        if (!user || typeof user !== 'object') return;
        var keys = [
            user.authUid ? 'uid:' + String(user.authUid).trim().toLowerCase() : '',
            user.email ? 'email:' + String(user.email).trim().toLowerCase() : '',
            user.loginName ? 'login:' + String(user.loginName).trim().toLowerCase() : '',
            user.id ? 'id:' + String(user.id).trim() : ''
        ].filter(Boolean);
        if (!keys.length) return;
        if (keys.some(function(key) { return aliases[key]; })) return;
        keys.forEach(function(key) { aliases[key] = true; });
        result.push(user);
    });
    return result;
}

function applyAppData(data) {
    if (!data || typeof data !== 'object') return false;
    var previousUsers = db.users;
    db.users = uniqueUserRecords(data.users); db.stores = dataArray(data.stores);
    db.orders = dataArray(data.orders); db.chats = dataArray(data.chats);
    db.reports = dataArray(data.reports); db.ad = data.ad || db.ad;
    db.policy = data.policy || db.policy; db.coupons = dataArray(data.coupons);
    db.faq = dataArray(data.faq); db.categories = dataArray(data.categories);
    db.chats.forEach(function(chat) { if (chat && !Array.isArray(chat.msgs)) chat.msgs = dataArray(chat.msgs); });
    db.orders.forEach(function(o) { if (!o.orderChat) o.orderChat = []; });
    if (currentUser && currentUser.type === 'driver') {
        var refreshed = db.users.find(function(u) { return u.id === currentUser.id; });
        if (refreshed) { currentUser = refreshed; announceIncomingNotifications(previousUsers); }
    }
    return true;
}

function cacheAppData() {
    var now = Date.now();
    if (!cacheAppData.windowStart) cacheAppData.windowStart = now;
    if (cacheAppData.timer) clearTimeout(cacheAppData.timer);
    var wait = Math.min(450, Math.max(0, 2000 - (now - cacheAppData.windowStart)));
    cacheAppData.timer = setTimeout(function() {
        cacheAppData.timer = null;
        cacheAppData.windowStart = 0;
        try { localStorage.setItem('z_appdata_cache', JSON.stringify({ users:db.users, stores:db.stores, orders:db.orders, chats:db.chats, reports:db.reports, ad:db.ad, policy:db.policy, coupons:db.coupons, faq:db.faq, categories:db.categories })); } catch (e) {}
    }, wait);
}

function loadCachedAppData() {
    try { var cached = JSON.parse(localStorage.getItem('z_appdata_cache') || 'null'); return applyAppData(cached); } catch (e) { return false; }
}

function loadLegacyRootData(done) {
    var paths = ['stores', 'users', 'orders', 'categories', 'reports', 'chats'];
    Promise.all(paths.map(function(path) { return database.ref(path).once('value'); })).then(function(snaps) {
        var values = {}; var found = false;
        paths.forEach(function(path, index) {
            var value = snaps[index].val();
            if (value !== null && value !== undefined) { values[path] = value; found = true; }
        });
        if (found) {
            if (values.stores) db.stores = dataArray(values.stores);
            if (values.users) db.users = uniqueUserRecords(values.users);
            if (values.orders) db.orders = dataArray(values.orders);
            if (values.categories) db.categories = dataArray(values.categories);
            if (values.reports) db.reports = dataArray(values.reports);
            if (values.chats) db.chats = dataArray(values.chats);
            db.orders.forEach(function(o) { if (!o.orderChat) o.orderChat = []; });
            cacheAppData();
        }
        if (typeof done === 'function') done(found);
    }).catch(function() { if (typeof done === 'function') done(false); });
}

function loadData() {
    if (!firebaseAuth.currentUser) { renderAuth(); return; }
    var authUid = firebaseAuth.currentUser.uid;
    if (loadedAuthUid === authUid && firebaseDataLoaded && currentUser) return;
    loadedAuthUid = authUid;
    database.ref('appData').off();
    database.ref('appData').on('value', function(snap) {
        if (!firebaseConnected) {
            firebaseDataLoaded = false;
            if (loadCachedAppData()) checkAuth();
            updateDeveloperConnectionBadge();
            return;
        }
        let data = snap.val();
        if (data) {
            applyAppData(data); firebaseDataLoaded = true; cacheAppData();
            if (!db.stores.length) loadLegacyRootData(function(){ checkAuth(); });
            else checkAuth();
        } else if (!loadCachedAppData()) {
            loadLegacyRootData(function(found) { firebaseDataLoaded = found; if (!found) showToast('لم نجد بيانات في appData أو المسارات القديمة. تحقق من مكان stores داخل Firebase.', 'warning', 7000); checkAuth(); });
        } else {
            loadLegacyRootData(function(found){ firebaseDataLoaded = found; if (!found) showToast('نعرض نسخة محفوظة مؤقتاً؛ الحفظ متوقف حتى الاتصال بقاعدة البيانات.', 'warning', 5000); checkAuth(); });
        }
    }, function(error) {
        loadLegacyRootData(function(found) {
            if (found && firebaseConnected) { firebaseDataLoaded = true; checkAuth(); showToast('تم تحميل المتاجر من المسار القديم في Firebase', 'info', 5000); }
            else if (loadCachedAppData()) { firebaseDataLoaded = false; checkAuth(); showToast('نعرض آخر نسخة محفوظة من المتاجر مؤقتاً؛ الحفظ متوقف حتى عودة الاتصال', 'warning', 5000); }
            else renderDatabaseError(error);
        });
    });
}

function ensureFreshAppData() {
    return database.ref('.info/connected').once('value').then(function(connectionSnapshot) {
        if (!connectionSnapshot.val()) return false;
        firebaseConnected = true;
        if (firebaseDataLoaded) return true;
        return database.ref('appData').once('value').then(function(snapshot) {
            if (snapshot.exists()) { applyAppData(snapshot.val()); cacheAppData(); }
            firebaseDataLoaded = true;
            return true;
        });
    }).catch(function() { return false; });
}

function saveAuthProfile(profile) {
    return ensureFreshAppData().then(function(ready) {
        if (!ready) return false;
        return database.ref('appData/users/' + profile.id).set(profile).then(function() {
            var existingIndex = db.users.findIndex(function(user) { return user.id === profile.id; });
            if (existingIndex === -1) db.users.push(profile);
            else db.users[existingIndex] = profile;
            cacheAppData();
            return true;
        });
    }).catch(function(error) {
        showToast('تعذر حفظ ملف الحساب في Firebase. تحقق من الاتصال ثم أعد المحاولة.', 'error', 5000);
        return false;
    });
}

function renderDatabaseError(error) {
    var code = error && error.code ? error.code : 'unknown';
    var isPermission = code === 'PERMISSION_DENIED' || (error && String(error.message || '').toLowerCase().indexOf('permission') !== -1);
    if (isPermission && !firebaseAuth.currentUser) { renderAuth(); return; }
    var title = isPermission ? 'تعذر الوصول إلى البيانات' : 'تعذر الاتصال بقاعدة البيانات';
    var signedEmail = firebaseAuth.currentUser && firebaseAuth.currentUser.email ? firebaseAuth.currentUser.email : 'لا يوجد حساب موثق';
    var message = isPermission ? 'تم تسجيل الدخول بالحساب: ' + signedEmail + '<br>لكن قواعد Firebase لا تسمح بقراءة البيانات لهذا الحساب. انشر قواعد Realtime Database من ملف firebase.database.rules.final.json، وتأكد من وجود البيانات في appData/stores أو stores.' : 'تحقق من الإنترنت وإعدادات Firebase ثم حاول مرة أخرى.';
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('report-btn').style.display = 'none';
    document.getElementById('app-content').innerHTML = '<div class="animate-fade"><div class="card" style="text-align:center;border:2px solid var(--warning);margin-top:30px;">' +
        '<i class="fas ' + (isPermission ? 'fa-lock' : 'fa-cloud-slash') + ' fa-3x" style="color:var(--warning)"></i>' +
        '<h3 style="margin:14px 0;color:var(--warning)">' + title + '</h3><p style="color:var(--text-muted);line-height:1.8">' + message + '</p>' +
        '<button class="btn btn-primary" style="margin-top:16px" onclick="loadData()"><i class="fas fa-redo"></i> إعادة الاتصال</button>' +
        '<button class="btn btn-outline" style="margin-top:10px" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تغيير الحساب</button>' +
        '<small style="display:block;color:var(--text-muted);margin-top:14px">رمز الخطأ: ' + code + '</small></div></div>';
}

function authErrorMessage(error, action) {
    var code = error && error.code ? error.code : '';
    var rawError = '';
    try { rawError = JSON.stringify(error || '').toUpperCase(); } catch (e) { rawError = String(error || '').toUpperCase(); }
    if (rawError.indexOf('INVALID_LOGIN_CREDENTIALS') !== -1) code = 'auth/invalid-login-credentials';
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') return action === 'quick' ? 'الاسم أو رمز الدخول غير صحيح. إذا كان الاسم جديداً سيُنشأ حسابك تلقائياً.' : 'بيانات الدخول غير صحيحة. راجع البريد/الرمز وكلمة المرور.';
    if (code === 'auth/user-not-found') return 'الحساب غير موجود. أنشئ حساباً جديداً أو جرّب الدخول بحساب Google.';
    if (code === 'auth/email-already-in-use') return 'هذا البريد مسجل مسبقاً. سنحاول إرجاعك إلى حسابك بدلاً من إنشاء حساب مكرر.';
    if (code === 'auth/account-exists-with-different-credential') return 'هذا البريد مرتبط بطريقة دخول أخرى. استخدم البريد وكلمة المرور أو افتح Gmail بنفس الحساب.';
    if (code === 'auth/too-many-requests') return 'تم إيقاف المحاولات مؤقتاً لحماية الحساب. حاول لاحقاً.';
    if (code === 'auth/popup-closed-by-user') return 'أُغلقت نافذة Google قبل إكمال الدخول.';
    if (code === 'auth/popup-blocked') return 'المتصفح منع نافذة Google. سنستخدم صفحة دخول بديلة.';
    if (code === 'auth/invalid-email') return 'صيغة البريد الإلكتروني غير صحيحة.';
    if (code === 'auth/weak-password') return 'كلمة المرور ضعيفة. استخدم 6 أحرف أو أكثر.';
    if (code === 'auth/user-disabled') return 'تم إيقاف هذا الحساب. تواصل مع الإدارة.';
    return (action === 'signup' ? 'تعذر إنشاء الحساب.' : 'تعذر تسجيل الدخول.') + (error && error.message ? ' ' + error.message : '');
}

    document.getElementById('main-nav').style.display = 'none';

}

function authProfileTemplate(authUser, overrides) {
    overrides = overrides || {};
    var authEmail = (authUser.email || '').toLowerCase();
    var isDeveloper = authEmail === DEVELOPER_EMAIL;
    var name = overrides.name || authUser.displayName || (overrides.loginName || '') || (authEmail ? authEmail.split('@')[0] : 'مستخدم جديد');
    var type = isDeveloper ? 'developer' : (overrides.type || 'customer');
    return {
        id: 'AUTH_' + authUser.uid, authUid: authUser.uid, name: name, email: isDeveloper ? authUser.email : (overrides.email || (overrides.loginMode === 'quick' ? '' : authUser.email)),
        authEmail: authUser.email || '', loginName: overrides.loginName || '', loginMode: overrides.loginMode || 'email', pass: '', type: type, role: type, isDeveloper: isDeveloper,
        phone: overrides.phone || '', cashCollected: 0, notifications: [], wallet: 0, addresses: [], createdAt: new Date().toLocaleString('ar-LY'), avatar: '', bio: '', rating: 0, ratingCount: 0
    };
}

function persistAuthProfile(profile) {
    if (!profile || !profile.id) return;
    return saveAuthProfile(profile);
}

function finishAuthenticatedUser(authUser, overrides) {
    if (!authUser) return;
    overrides = overrides || {};
    pendingAuthProfile = { authUid: authUser.uid, name: overrides.name || '', loginName: overrides.loginName || '', loginMode: overrides.loginMode || 'email', type: overrides.type || 'customer', phone: overrides.phone || '', email: overrides.email || '' };
    if (overrides.type) localStorage.setItem('z_pending_role', overrides.type);
    renderAuthLoading('تم التحقق من الحساب، نربط بياناتك الآن…');
    firebaseDataLoaded = false;
    loadData();
}

function checkAuth() {
    var authUser = firebaseAuth.currentUser;
    if (authUser) {
        var previousUserId = currentUser && currentUser.id ? currentUser.id : '';
        var shellWasVisible = document.getElementById('main-header').style.display !== 'none';
        var authEmail = (authUser.email || '').toLowerCase();
        var pending = pendingAuthProfile && pendingAuthProfile.authUid === authUser.uid ? pendingAuthProfile : null;
        if (!pending) {
            pending = { type: localStorage.getItem('z_pending_role') || 'customer', loginMode: authEmail.indexOf('@quick.zliten.tripol') !== -1 ? 'quick' : 'email' };
        }
        var authProfile = db.users.find(function(u) {
            return u.authUid === authUser.uid || (authEmail && u.email && u.email.toLowerCase() === authEmail) || (pending.loginName && u.loginName && u.loginName.toLowerCase() === pending.loginName.toLowerCase());
        });
        if (!authProfile) {
            authProfile = authProfileTemplate(authUser, pending);
            db.users.push(authProfile);
            persistAuthProfile(authProfile);
        } else {
            var profileChanged = false;
            if (!authProfile.authUid) { authProfile.authUid = authUser.uid; profileChanged = true; }
            if (!authProfile.authEmail) { authProfile.authEmail = authUser.email || ''; profileChanged = true; }
            if (pending.loginName && !authProfile.loginName) { authProfile.loginName = pending.loginName; profileChanged = true; }
            if (pending.loginMode && !authProfile.loginMode) { authProfile.loginMode = pending.loginMode; profileChanged = true; }
            if (pending.phone && !authProfile.phone) { authProfile.phone = pending.phone; profileChanged = true; }
            if (profileChanged) persistAuthProfile(authProfile);
        }
        currentUser = authProfile;
        pendingAuthProfile = null;
        authBusy = false;
        localStorage.removeItem('z_pending_role');
        localStorage.setItem('z_user_id', authProfile.id);
        if (!previousUserId || previousUserId !== authProfile.id || !shellWasVisible) updateUI();
        else { updateCartBadge(); updateNotifyBadge(); }
        return;
    }
    let savedId = localStorage.getItem('z_user_id');
    if (savedId && db.users.length) {
        let user = db.users.find(function(u) { return u.id === savedId; });
        if (user) { currentUser = user; authBusy = false; updateUI(); return; }
    }
    currentUser = null;
    renderAuth();
}

function logout() {
    stopLiveLocationTracking(true);

function createFirebaseAccount() {
    var email = document.getElementById('auth-email').value.trim().toLowerCase();

    var type = document.getElementById('auth-type').value;
    var phone = document.getElementById('auth-phone') ? document.getElementById('auth-phone').value : '';

    if (pass.length < 6) { showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error'); return; }
    setAuthBusy(true);
    firebaseAuth.createUserWithEmailAndPassword(email, pass).then(function(result) {

        showToast('تم إنشاء الحساب بنجاح، لحظات ونفتح التطبيق…', 'success', 2500);
    }).catch(function(error) {
        if (error && error.code === 'auth/email-already-in-use') {
            firebaseAuth.signInWithEmailAndPassword(email, pass).then(function(result) {
                finishAuthenticatedUser(result.user, { type: type, phone: phone, email: email, loginMode: 'email' });
                showToast('هذا البريد كان مسجلاً، تم إرجاعك إلى حسابك مباشرة.', 'success', 3500);
            }).catch(function(loginError) {

            });

        }
        setAuthBusy(false);
        showToast(authErrorMessage(error, 'signup'), 'error', 5000);

function quickAuth() {
    var name = normalizeQuickName(document.getElementById('auth-name') ? document.getElementById('auth-name').value : '');
    var code = document.getElementById('auth-pass') ? document.getElementById('auth-pass').value.trim() : '';
    var type = document.getElementById('auth-type').value;
    var phone = document.getElementById('auth-phone') ? document.getElementById('auth-phone').value : '';
    if (name.length < 2 || name.length > 32) { showToast('اكتب اسماً بين حرفين و32 حرفاً', 'error'); return; }
    if (code.length < 4) { showToast('رمز الدخول يجب أن يكون 4 أحرف أو أرقام على الأقل', 'error'); return; }
    var quickEmail = quickEmailForName(name);
    var quickPassword = quickPasswordForCode(code);
    setAuthBusy(true);
    firebaseAuth.signInWithEmailAndPassword(quickEmail, quickPassword).then(function(result) {
        finishAuthenticatedUser(result.user, { type: type, phone: phone, loginMode: 'quick', loginName: name, name: name });
        showToast('تم إرجاع حسابك بسرعة.', 'success', 2500);
    }).catch(function(error) {
        // تفعيل Email Enumeration Protection يجعل Firebase يعيد invalid-credential
        // بدلاً من user-not-found للحساب السريع الجديد؛ نجرّب الإنشاء بأمان.
        var rawError = '';
        try { rawError = JSON.stringify(error || '').toUpperCase(); } catch (e) { rawError = String(error || '').toUpperCase(); }
        var canTryCreate = error && (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential' || error.code === 'auth/invalid-login-credentials' || rawError.indexOf('INVALID_LOGIN_CREDENTIALS') !== -1);
        if (canTryCreate) {
            firebaseAuth.createUserWithEmailAndPassword(quickEmail, quickPassword).then(function(result) {
                var update = result.user.updateProfile ? result.user.updateProfile({ displayName: name }) : Promise.resolve();
                update.catch(function(){}).then(function() {
                    finishAuthenticatedUser(result.user, { type: type, phone: phone, loginMode: 'quick', loginName: name, name: name });
                    showToast('تم إنشاء حسابك السريع بنجاح.', 'success', 3000);
                });
            }).catch(function(createError) {
                setAuthBusy(false);
                if (createError && createError.code === 'auth/email-already-in-use') {
                    showToast('هذا الاسم مستخدم من قبل، ورمز الدخول غير مطابق. اكتب الرمز الذي أنشأت به الحساب.', 'error', 6000);
                    return;
                }
                showToast(authErrorMessage(createError, 'signup'), 'error', 5000);
            });
            return;
        }
        setAuthBusy(false);
        showToast(error && (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential' || error.code === 'auth/invalid-login-credentials' || rawError.indexOf('INVALID_LOGIN_CREDENTIALS') !== -1) ? 'الاسم أو رمز الدخول غير صحيح. إذا كان الاسم جديداً سيُنشأ حسابك تلقائياً.' : authErrorMessage(error, 'quick'), 'error', 5000);
    });
}

}

function getStoreRatingSummary(store) {
    let verified = db.orders.reduce(function(total, order) {
        let review = order && order.storeReview;
        if (order && String(order.storeId) === String(store.id) && review && review.reviewerUid === order.customerAuthUid && String(review.reviewerId) === String(order.userId) && review.targetType === 'store' && String(review.targetId) === String(store.id) && isReviewDeliveryStatus(order.status)) {
            let rating = Number(review.rating);
            if (rating >= 1 && rating <= 5) { total.sum += rating; total.count += 1; }
        }
        return total;
    }, { sum: 0, count: 0 });
    return { sum: verified.sum, count: verified.count, average: verified.count ? verified.sum / verified.count : 0 };
}

function getDriverRatingSummary(driver) {
    let verified = db.orders.reduce(function(total, order) {
        let review = order && order.driverReview;
        if (order && String(order.driverId) === String(driver.id) && review && review.reviewerUid === order.customerAuthUid && String(review.reviewerId) === String(order.userId) && review.targetType === 'driver' && String(review.targetId) === String(driver.id) && isReviewDeliveryStatus(order.status)) {
            let rating = Number(review.rating);
            if (rating >= 1 && rating <= 5) { total.sum += rating; total.count += 1; }
        }
        return total;
    }, { sum: 0, count: 0 });
    return { sum: verified.sum, count: verified.count, average: verified.count ? verified.sum / verified.count : 0 };
}

function isReviewDeliveryStatus(status) {
    return status === 'تم التسليم ✅' || status === 'تم التسليم';
}

function canReviewOrder(order, targetType, targetId) {
    let authUid = firebaseAuth && firebaseAuth.currentUser ? firebaseAuth.currentUser.uid : '';
    if (!order || !currentUser || !authUid || String(order.userId) !== String(currentUser.id) || order.customerAuthUid !== authUid || !isReviewDeliveryStatus(order.status)) return false;
    if (targetType === 'store') return String(order.storeId) === String(targetId) && !order.storeReview;
    if (targetType === 'driver') return !!order.driverId && String(order.driverId) === String(targetId || order.driverId) && !order.driverReview && !order.driverRated;
    return false;
}

function findEligibleReviewOrder(targetType, targetId) {
    for (let i = db.orders.length - 1; i >= 0; i--) {
        if (canReviewOrder(db.orders[i], targetType, targetId)) return db.orders[i];
    }
    return null;
}

function saveVerifiedOrderReview(orderId, targetType, targetId, rating, comment) {
    let authUser = firebaseAuth && firebaseAuth.currentUser;
    if (!authUser || !firebaseConnected || !firebaseDataLoaded) {
        showToast('تعذر التقييم الآن؛ تحقق من تسجيل الدخول والاتصال ثم أعد المحاولة.', 'error', 5000);
        return Promise.resolve(false);
    }
    let orderIndex = db.orders.findIndex(function(order) { return order && String(order.id) === String(orderId); });
    if (orderIndex < 0) { showToast('لم يتم العثور على الطلب.', 'error'); return Promise.resolve(false); }
    let reviewField = targetType === 'store' ? 'storeReview' : 'driverReview';
    let orderRef = database.ref('appData/orders/' + orderIndex);
    return orderRef.once('value').then(function(snapshot) {
        let freshOrder = snapshot.val();
        if (!freshOrder || String(freshOrder.id) !== String(orderId) || !canReviewOrder(freshOrder, targetType, targetId)) return { eligible: false };
        let review = {
            orderId: String(freshOrder.id), targetType: targetType, targetId: String(targetId),
            reviewerUid: authUser.uid, reviewerId: String(freshOrder.userId), reviewerName: String(freshOrder.userName || 'زبون').slice(0, 80),
            rating: Number(rating), comment: String(comment || '').trim().slice(0, 500), createdAt: Date.now()
        };
        return new Promise(function(resolve) {
            database.ref('appData/orders/' + orderIndex + '/' + reviewField).transaction(function(existing) {
                return existing === null ? review : undefined;
            }, function(error, committed, resultSnapshot) {
                resolve({ error: error, committed: committed, review: resultSnapshot && resultSnapshot.val(), order: freshOrder });
            }, false);
        });
    }).then(function(result) {
        if (!result || result.eligible === false) {
            showToast('لا يمكن تقييم هذا الطلب إلا بعد تسليمه ومن الحساب الذي طلبه، ولمرة واحدة.', 'warning', 5000);
            return false;
        }
        if (result.error) {
            showToast(result.error.code === 'PERMISSION_DENIED' ? 'رفضت قواعد Firebase التقييم لهذا الطلب؛ لم يُحفظ.' : 'تعذر حفظ التقييم في Firebase.', 'error', 5000);
            return false;
        }
        if (!result.committed) {
            showToast('سبق تقييم هذا الطلب؛ لا يمكن تكرار التقييم.', 'warning', 4000);
            return false;
        }
        if (db.orders[orderIndex] && String(db.orders[orderIndex].id) === String(orderId)) db.orders[orderIndex][reviewField] = result.review;
        cacheAppData();
        showToast(targetType === 'store' ? 'تم حفظ تقييم المتجر بنجاح، شكراً لك! ⭐' : 'تم حفظ تقييم السائق بنجاح، شكراً لك! ⭐');
        return true;
    }).catch(function(error) {
        showToast(error && error.code === 'PERMISSION_DENIED' ? 'رفضت قواعد Firebase التقييم لهذا الطلب؛ لم يُحفظ.' : 'تعذر حفظ التقييم في Firebase.', 'error', 5000);
        return false;
    });
}

// ==================== الرئيسية ====================
function safeStoreImageSource(value) {
    var source = String(value || '').trim();
    if (!source) return '';
    if (/^data:image\/(?:png|jpe?g|gif|webp|avif);base64,/i.test(source)) return source;
    try {
        var parsed = new URL(source, window.location.origin);
        if (parsed.protocol === 'https:' || parsed.origin === window.location.origin) return parsed.href;
    } catch (e) {}
    return '';
}

function isStoreBlocked(store) {
    return !!(store && store.isBlocked === true);
}

function getVisibleStores(query) {
    var visible = db.stores.filter(function(store) { return store && !isStoreBlocked(store) && (currentCategory === 'all' || store.category === currentCategory); });
    var term = String(query || '').trim().toLowerCase();
    if (!term) return visible;
    return visible.filter(function(store) {
        var storeName = String(store.name || '').toLowerCase();
        var hasProduct = Array.isArray(store.products) && store.products.some(function(product) { return product && String(product.name || '').toLowerCase().indexOf(term) !== -1; });
        return storeName.indexOf(term) !== -1 || hasProduct;
    });
}

function renderStoreCards(stores) {

        var productCount = Array.isArray(store.products) ? store.products.filter(Boolean).length : 0;
        var ratingSummary = getStoreRatingSummary(store);
        var ratingCount = ratingSummary.count;
        var rating = ratingSummary.average;
        var ratingLabel = ratingCount ? rating.toFixed(1) : 'جديد';
        var roundedRating = Math.round(rating);
        var isOpen = store.isOpen !== false;
        var isFavorite = favorites.indexOf(store.id) !== -1;
        return '<article class="storefront-card">' +
            '<button type="button" class="storefront-open" data-store-action="open" data-store-id="' + storeId + '" aria-label="عرض متجر ' + name + '">' +
            '<span class="storefront-cover">' + (image ? '<img src="' + escapeHtml(image) + '" alt="' + name + '" loading="lazy" decoding="async">' : '<span class="storefront-cover-placeholder"><i class="fas fa-store"></i><small>متجر محلي</small></span>') +
            '<span class="storefront-state ' + (isOpen ? 'is-open' : 'is-closed') + '"><i class="fas fa-circle"></i> ' + (isOpen ? 'مفتوح الآن' : 'مغلق الآن') + '</span></span>' +
            '<span class="storefront-card-body"><span class="storefront-card-title"><strong>' + name + '</strong><i class="fas fa-arrow-left"></i></span>' +
            '<span class="storefront-category">' + category + '</span><span class="storefront-card-meta"><span><i class="fas fa-box-open"></i> ' + productCount + ' منتجات</span><span class="storefront-rating"><i class="fas fa-star"></i> ' + ratingLabel + (ratingCount ? ' <small>(' + ratingCount + ')</small>' : '') + '</span></span></span></button>' +
            '<button type="button" class="storefront-favorite ' + (isFavorite ? 'active' : '') + '" data-store-action="favorite" data-store-id="' + storeId + '" aria-label="' + (isFavorite ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة') + '"><i class="fas fa-heart"></i></button></article>';
    }).join('');
}

function handleStorefrontAction(event) {
    var target = event.target;
    var control = target && target.closest ? target.closest('[data-store-action]') : null;
    if (!control) return;
    var action = control.getAttribute('data-store-action');
    var storeId = control.getAttribute('data-store-id');
    if (action === 'category') return setCategory(storeId);
    if (action === 'open') return navigate('store', storeId);
    if (action === 'favorite') return toggleFavorite(storeId);
    if (action === 'message') return messageStoreOwner(control.getAttribute('data-owner-id'));
    if (action === 'rate') { var orderIndex = Number(control.getAttribute('data-order-index')); var order = Number.isInteger(orderIndex) ? db.orders[orderIndex] : null; return rateStore(storeId, order ? order.id : undefined); }
    if (action === 'add') {
        var store = db.stores.find(function(item) { return String(item.id) === storeId; });
        var productIndex = Number(control.getAttribute('data-product-index'));
        var product = store && Array.isArray(store.products) ? store.products[productIndex] : null;
        if (!product) return showToast('تعذر العثور على المنتج. حدّث صفحة المتجر وحاول مجدداً.', 'warning');
        var price = Number(product.price || 0);
        if (!Number.isFinite(price) || price < 0) price = 0;
        return addToCart(store.id, product.name || 'منتج', price, safeStoreImageSource(product.img));
    }
}

function setCategory(catId) { currentCategory = catId; navigate('home'); }

function handleSearch(query) {
    searchQuery = query;
    let storesList = document.getElementById('stores-list');
    if (!storesList) return;
    let filteredStores = getVisibleStores(query);
    storesList.innerHTML = renderStoreCards(filteredStores) || '<div class="storefront-empty"><i class="fas fa-magnifying-glass"></i><strong>ما لقينا نتائج</strong><p>جرب كلمة ثانية أو غيّر التصنيف.</p></div>';
    let clearButton = document.querySelector('.storefront-search-clear');
    if (clearButton) clearButton.style.display = String(query || '').trim() ? 'grid' : 'none';
    let count = document.getElementById('store-results-count');
    if (count) count.textContent = filteredStores.length + ' متجر';
    let openCount = filteredStores.filter(function(store) { return store.isOpen !== false; }).length;
    let openSummary = document.querySelector('.storefront-open-count');
    if (openSummary) openSummary.innerHTML = '<span class="storefront-open-dot"></span> ' + openCount + ' من المتاجر المعروضة مفتوحة الآن';

function toggleFavorite(storeId) {
    let idx = favorites.indexOf(storeId);
    if (idx > -1) { favorites.splice(idx, 1); showToast('تم الإزالة من المفضلة'); }
    else { favorites.push(storeId); showToast('تم الإضافة للمفضلة ❤️'); }
    localStorage.setItem('z_favorites', JSON.stringify(favorites));
    navigate(activePage === 'store' ? 'store' : 'home', activePage === 'store' ? storeId : undefined);
}

    let availableStores = db.stores.filter(function(store) { return store && !isStoreBlocked(store); });

    let store = availableStores[Math.floor(Math.random() * availableStores.length)];
    if (store.products && store.products.length) {
        let prod = store.products[Math.floor(Math.random() * store.products.length)];
        let price = Number(prod.price || 0);
        if (!Number.isFinite(price) || price < 0) price = 0;

function getCurrentLocation(callback) {
    if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', 'error');
    showToast('سيطلب الهاتف إذن الموقع الآن؛ وافق لإكمال الطلب', 'info', 4500);
    navigator.geolocation.getCurrentPosition(
        function(pos) { locationPermissionState = 'granted'; currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }; updateCustomerMap(currentLocation); let el = document.getElementById('location-status'); if (el) el.innerHTML = isInsideZaltan(currentLocation) ? '✅ داخل نطاق زلطن • دقة ' + Math.round(pos.coords.accuracy) + 'م' : '⚠️ الموقع خارج نطاق زلطن'; if (callback) callback(); },
        function(err) { locationPermissionState = err && err.code === 1 ? 'denied' : 'error'; let el = document.getElementById('location-status'); if (el) el.innerHTML = '⚠️ يجب السماح بالموقع من أذونات الهاتف'; showModal('تفعيل الموقع مطلوب', '<div style="line-height:1.9">لا يمكن إرسال طلب توصيل بدون تحديد الموقع.<br><br><b>اضغط السماح أثناء ظهور نافذة الهاتف.</b><br>إذا اخترت الرفض سابقاً: افتح إعدادات الهاتف ← أذونات التطبيق ← الموقع، واختر السماح أثناء الاستخدام، ثم اضغط إعادة المحاولة.</div>', 'confirm', function(){ getCurrentLocation(callback); }); },
        { enableHighAccuracy:true, timeout:12000, maximumAge:30000 }
    );
}

function isInsideZaltan(location) {
    if (!location || !Number.isFinite(Number(location.lat)) || !Number.isFinite(Number(location.lng))) return false;
    var lat1 = Number(location.lat) * Math.PI / 180, lng1 = Number(location.lng) * Math.PI / 180;
    var lat2 = ZALTAN_CENTER[0] * Math.PI / 180, lng2 = ZALTAN_CENTER[1] * Math.PI / 180;
    var dLat = lat1 - lat2, dLng = lng1 - lng2;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    var distanceKm = 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return distanceKm <= ZALTAN_SERVICE_RADIUS_KM;
}

let customerMap = null, customerMarker = null, customerAccuracyCircle = null;
function initCustomerMap() {
    var holder = document.getElementById('customer-map');
    if (!holder || typeof L === 'undefined') return;
    if (customerMap) { customerMap.remove(); customerMap = null; customerMarker = null; customerAccuracyCircle = null; }
    var fallback = ZALTAN_CENTER;
    var start = currentLocation ? [currentLocation.lat, currentLocation.lng] : fallback;
    customerMap = L.map(holder, { zoomControl:true, attributionControl:true, maxBounds:ZALTAN_MAP_BOUNDS, maxBoundsViscosity:0.9, minZoom:11, maxZoom:18 }).setView(start, currentLocation ? 16 : 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(customerMap);
    L.circle(ZALTAN_CENTER, { radius:ZALTAN_SERVICE_RADIUS_KM * 1000, color:'#00d4ff', weight:1, dashArray:'6 7', fillColor:'#00d4ff', fillOpacity:.045 }).addTo(customerMap).bindTooltip('نطاق التوصيل داخل مدينة زلطن', { sticky:true });
    if (currentLocation) updateCustomerMap(currentLocation);
    customerMap.on('click', function(event) { setCustomerMapSelection(event.latlng); });
    setTimeout(function(){ if (customerMap) customerMap.invalidateSize(); }, 200);
}
function setCustomerMapSelection(point) {
    currentLocation = { lat:Number(point.lat), lng:Number(point.lng), accuracy:0 };
    updateCustomerMap(currentLocation);
    var status = document.getElementById('location-status');
    if (status) status.textContent = isInsideZaltan(currentLocation) ? 'تم تحديد نقطة التسليم داخل نطاق زلطن' : 'النقطة المختارة خارج نطاق التوصيل';
}
function updateCustomerMap(location) {
    if (!customerMap || !location) return;
    var point = [Number(location.lat), Number(location.lng)];
    if (!customerMarker) {
        customerMarker = L.marker(point, { draggable:true }).addTo(customerMap).bindPopup('موقع التسليم');
        customerMarker.on('dragend', function(event) { setCustomerMapSelection(event.target.getLatLng()); });
    }
    else customerMarker.setLatLng(point);
    if (customerAccuracyCircle) customerAccuracyCircle.setLatLng(point).setRadius(Number(location.accuracy || 30));
    else customerAccuracyCircle = L.circle(point, { radius:Number(location.accuracy || 30), color:'#00d4ff', fillColor:'#00d4ff', fillOpacity:.12 }).addTo(customerMap);
    customerMap.setView(point, 16, { animate:true });
}

function initCheckoutSignaturePad() {
    var canvas = document.getElementById('order-signature-pad');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#172b3a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    canvas.dataset.signed = 'false';
    var drawing = false;
    var lastPoint = null;
    function point(event) {
        var source = event.touches && event.touches.length ? event.touches[0] : (event.changedTouches && event.changedTouches.length ? event.changedTouches[0] : event);
        var rect = canvas.getBoundingClientRect();
        return { x:(source.clientX - rect.left) * canvas.width / Math.max(rect.width, 1), y:(source.clientY - rect.top) * canvas.height / Math.max(rect.height, 1) };
    }
    function startDrawing(event) {
        if (event.button !== undefined && event.button !== 0) return;
        if (event.cancelable) event.preventDefault();
        drawing = true;
        lastPoint = point(event);
        canvas.dataset.signed = 'true';
        if (event.pointerId !== undefined && canvas.setPointerCapture) {
            try { canvas.setPointerCapture(event.pointerId); } catch (captureError) {}
        }
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fill();
        var status = document.getElementById('signature-status');
        if (status) status.textContent = 'تم تسجيل التوقيع؛ يمكنك مسحه وإعادة الرسم إذا رغبت.';
    }
    function moveDrawing(event) {
        if (!drawing) return;
        if (event.cancelable) event.preventDefault();
        var nextPoint = point(event);
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(nextPoint.x, nextPoint.y);
        ctx.stroke();
        lastPoint = nextPoint;
    }
    function stopDrawing() { drawing = false; lastPoint = null; }
    var supportsPointerEvents = typeof window !== 'undefined' && 'PointerEvent' in window;
    if (supportsPointerEvents) {
        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', moveDrawing);
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function(name) { canvas.addEventListener(name, stopDrawing); });
    } else {
        canvas.addEventListener('touchstart', startDrawing, { passive:false });
        canvas.addEventListener('touchmove', moveDrawing, { passive:false });
        ['touchend', 'touchcancel'].forEach(function(name) { canvas.addEventListener(name, stopDrawing); });
        canvas.addEventListener('mousedown', startDrawing);
        document.addEventListener('mousemove', moveDrawing);
        document.addEventListener('mouseup', stopDrawing);
    }
    canvas.addEventListener('contextmenu', function(event) { event.preventDefault(); });
}

function clearCheckoutSignature() {
    var canvas = document.getElementById('order-signature-pad');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (ctx) { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    canvas.dataset.signed = 'false';
    var status = document.getElementById('signature-status');
    if (status) status.textContent = 'تم مسح التوقيع. ارسم توقيعك أو اكتب اسمك في الحقل البديل.';

function fillAddressFromSelect(val) {
    if (!val) return;
    let idx = parseInt(val);
    let addr = currentUser.addresses[idx];
    if (addr) document.getElementById('order-address').value = addr.text;
}

function updateCheckoutSummary() {
    var total = cart.reduce(function(sum, item) { return sum + Number(item.price || 0); }, 0);
    var discount = appliedCoupon ? Math.round(total * (Number(appliedCoupon.discount || 0) / 100)) : 0;
    var subtotalEl = document.getElementById('checkout-subtotal');
    var discountRow = document.getElementById('checkout-discount-row');
    var discountEl = document.getElementById('checkout-discount');
    var totalEl = document.getElementById('checkout-total');
    var couponStatus = document.getElementById('checkout-coupon-status');
    if (subtotalEl) subtotalEl.textContent = total + ' د.ل';
    if (discountRow) discountRow.style.display = appliedCoupon ? 'flex' : 'none';
    if (discountEl) discountEl.textContent = '-' + discount + ' د.ل';
    if (totalEl) totalEl.textContent = (total - discount) + ' د.ل';
    if (couponStatus) couponStatus.innerHTML = appliedCoupon ? 'تم تطبيق الكود ' + escapeHtml(appliedCoupon.code) + ' <button type="button" class="checkout-coupon-clear" onclick="clearAppliedCoupon()">إزالة</button>' : '';
}

function applyCoupon() {
    let input = document.getElementById('coupon-code');
    let code = input ? input.value.trim().toUpperCase() : '';
    if (!code) return;
    let coupon = db.coupons.find(function(c) { return c.code === code && c.active && usedCoupons.indexOf(code) === -1; });
    if (coupon) { appliedCoupon = coupon; if (input) input.value = ''; updateCheckoutSummary(); showToast('تم تطبيق كود الخصم! خصم ' + coupon.discount + '%'); }
    else { showToast('كود غير صالح أو مستخدم', 'error'); }
}

function clearAppliedCoupon() {
    appliedCoupon = null;
    updateCheckoutSummary();
    showToast('تمت إزالة كود الخصم');
}

function confirmOrder() {
    if (orderSubmitInProgress) return;
    let addr = document.getElementById('order-address') ? document.getElementById('order-address').value : '';
    let phone = document.getElementById('order-phone') ? document.getElementById('order-phone').value : '';
    let notes = document.getElementById('order-notes') ? document.getElementById('order-notes').value.trim() : '';
    let time = document.getElementById('delivery-time') ? document.getElementById('delivery-time').value : 'now';
    if (!cart.length) return showToast('السلة فارغة؛ أضف منتجاً قبل إرسال الطلب.', 'error');
    if (!addr.trim() || !phone.trim()) return showToast('أكمل عنوان التوصيل ورقم الهاتف قبل المتابعة.', 'error');
    if (!currentLocation) return showToast('اضغط «تحديد موقعي» واسمح بإذن الموقع أولاً', 'error', 5000);
    if (!isInsideZaltan(currentLocation)) return showToast('التوصيل متاح داخل مدينة زلطن فقط', 'error', 5000);
    let storeId = cart[0].sid;
    if (cart.some(function(item) { return String(item.sid) !== String(storeId); })) return showToast('السلة تحتوي منتجات من متاجر مختلفة. أزل منتجات أحد المتاجر قبل المتابعة.', 'error', 5000);
    let store = db.stores.find(function(item) { return String(item.id) === String(storeId); });
    if (!store || isStoreBlocked(store)) return showToast('المتجر المرتبط بالسلة غير متاح حالياً. أزل منتجاته من السلة لاختيار متجر آخر.', 'error', 5000);
    let consentCheckbox = document.getElementById('checkout-consent');
    if (!consentCheckbox || !consentCheckbox.checked) return showToast('يرجى الموافقة على الإقرار وسياسة الاستخدام قبل إرسال الطلب.', 'error', 5000);
    let signatureCanvas = document.getElementById('order-signature-pad');
    let typedSignature = document.getElementById('order-signature-name') ? document.getElementById('order-signature-name').value.trim() : '';
    let hasDrawnSignature = !!(signatureCanvas && signatureCanvas.dataset.signed === 'true');
    if (!hasDrawnSignature && typedSignature.length < 2) return showToast('أضف توقيعك في المربع الأبيض أو اكتب اسمك في حقل التوقيع البديل.', 'error', 5000);
    let customerAuthUid = firebaseAuth && firebaseAuth.currentUser ? firebaseAuth.currentUser.uid : '';
    if (!customerAuthUid) return showToast('سجّل الدخول بحساب موثّق قبل إرسال الطلب.', 'error');
    let total = cart.reduce(function(s, i) { return s + Number(i.price || 0); }, 0);
    let discount = appliedCoupon ? Math.round(total * (appliedCoupon.discount / 100)) : 0;
    let consentAcceptedAt = Date.now();
    let signatureImage = hasDrawnSignature ? signatureCanvas.toDataURL('image/png') : '';
    let order = {
        id: 'ORD' + Date.now(), userId: currentUser.id, userName: currentUser.name, customerAuthUid: customerAuthUid,
        storeId: storeId, items: JSON.parse(JSON.stringify(cart)), location: addr, phone: phone, notes: notes,
        status: 'قيد الانتظار ⏳', createdAt: new Date().toLocaleString('ar-LY'),
        driverId: null, coordinates: currentLocation, orderChat: [],
        coupon: appliedCoupon ? appliedCoupon.code : null, discount: discount, total: total - discount,
        deliveryTime: time, deliveryProof: null,
        customerConsent: {
            accepted: true, acceptedAt: consentAcceptedAt, consentVersion: 'checkout-consent-v1',
            consentText: ORDER_CONSENT_TEXT, policySnapshot: String(db.policy || ''),
            signatureMethod: hasDrawnSignature ? 'drawn' : 'typed',
            signatureImage: signatureImage || null, signatureText: hasDrawnSignature ? '' : typedSignature,
            signerName: currentUser.name || typedSignature
        }
    };
    db.orders.push(order);
    let orderNotification = store ? addNotification(store.ownerId, 'طلب جديد من ' + currentUser.name, '', true) : null;
    orderSubmitInProgress = true;
    let submitButton = document.getElementById('confirm-order-button');
    if (submitButton) { submitButton.disabled = true; submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ حفظ الطلب...'; }
    sync().then(function(saved) {
        if (!saved) {
            db.orders = db.orders.filter(function(existingOrder) { return existingOrder.id !== order.id; });
            if (orderNotification && store) {
                let owner = db.users.find(function(user) { return user.id === store.ownerId; });
                if (owner && owner.notifications) owner.notifications = owner.notifications.filter(function(notification) { return notification.id !== orderNotification.id; });
            }
            orderSubmitInProgress = false;
            if (submitButton) { submitButton.disabled = false; submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الطلب'; }
            showToast('لم يُحفظ الطلب؛ أبقينا بياناتك والسلة كما هي لتتمكن من المحاولة لاحقاً.', 'error', 6000);
            return false;
        }
        if (appliedCoupon) {
            usedCoupons.push(appliedCoupon.code);
            try { localStorage.setItem('z_used_coupons', JSON.stringify(usedCoupons)); } catch (storageError) {}
        }
        cart = []; appliedCoupon = null; currentLocation = null;
        orderSubmitInProgress = false;
        updateCartBadge();
        showToast('تم إرسال الطلب بنجاح! 🎉');
        navigate('orders');
        return true;
    }).catch(function() {
        db.orders = db.orders.filter(function(existingOrder) { return existingOrder.id !== order.id; });
        orderSubmitInProgress = false;
        if (submitButton) { submitButton.disabled = false; submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الطلب'; }
        showToast('تعذر إتمام الإرسال؛ احتفظنا بالسلة لتتمكن من المحاولة مرة أخرى.', 'error', 6000);
        return false;
    });
}

function getOrderStatusMeta(status) {
    status = status || '';
    if (status.indexOf('تسليم') !== -1) return { key:'done', index:4, label:'تم التسليم', icon:'fa-check-double', cls:'status-done' };
    if (status.indexOf('وصلت') !== -1 || status.indexOf('توصيل') !== -1) return { key:'delivery', index:3, label:status.indexOf('وصلت') !== -1 ? 'السائق وصل للموقع' : 'جاري التوصيل', icon:'fa-motorcycle', cls:'status-delivery' };
    if (status.indexOf('قبول') !== -1) return { key:'accepted', index:2, label:'تم قبول الطلب', icon:'fa-thumbs-up', cls:'status-accepted' };
    return { key:'pending', index:1, label:'قيد المراجعة', icon:'fa-hourglass-half', cls:'status-pending' };
}

function setOrdersFilter(filter) { ordersFilter = filter; navigate('orders'); }

function renderOrderProgress(meta) {
    let steps = [
        { label:'استلام الطلب', icon:'fa-receipt' },
        { label:'قبول الطلب', icon:'fa-thumbs-up' },
        { label:'في الطريق', icon:'fa-motorcycle' },
        { label:'تم التسليم', icon:'fa-check' }
    ];
    let lineWidth = Math.max(0, Math.min(100, ((meta.index - 1) / 3) * 82));
    return '<div class="order-progress"><span class="order-progress-line" style="width:' + lineWidth + '%"></span>' + steps.map(function(step, i) {
        let stepNo = i + 1, cls = stepNo < meta.index ? 'done' : stepNo === meta.index ? 'active' : '';
        return '<div class="order-progress-step ' + cls + '"><i class="fas ' + step.icon + '"></i><span>' + step.label + '</span></div>';
    }).join('') + '</div>';
}

        '<div class="orders-filter"><button class="category-pill ' + (ordersFilter === 'all' ? 'active' : '') + '" onclick="setOrdersFilter(\'all\')">الكل <small>(' + allOrders.length + ')</small></button>' +

        container.innerHTML += '<div class="empty-state card"><i class="fas fa-box-open"></i><h3>ابدأ أول طلب لك</h3><p>اكتشف المتاجر المحلية واطلب ما تحتاجه بسهولة.</p><button class="btn btn-primary btn-sm" onclick="navigate(\'home\')"><i class="fas fa-store"></i> تصفح المتاجر</button></div></div>';

    }

        return;
    }
    let orderCardsHtml = '';
    visibleOrders.forEach(function(o) {
        let meta = getOrderStatusMeta(o.status), store = db.stores.find(function(s) { return s.id === o.storeId; });
        let items = o.items || [], itemCount = items.reduce(function(sum, item) { return sum + (Number(item.quantity) || 1); }, 0);
        let timeLabel = o.deliveryTime === 'now' ? 'الآن' : o.deliveryTime === '30' ? 'خلال 30 دقيقة' : o.deliveryTime === '60' ? 'خلال ساعة' : 'خلال ساعتين';
        let shortId = String(o.id || '').slice(-6);
        let orderIndex = db.orders.indexOf(o);
        let storeReviewAction = meta.key !== 'done' ? '' : (o.storeReview ? '<span class="tag tag-success">تم تقييم المتجر</span>' : (canReviewOrder(o, 'store', o.storeId) ? '<button class="btn btn-sm btn-warning" data-rate-store-index="' + orderIndex + '"><i class="fas fa-star"></i> تقييم المتجر</button>' : ''));
        let driverReviewAction = meta.key !== 'done' || !o.driverId ? '' : (o.driverReview || o.driverRated ? '<span class="tag tag-success">تم تقييم السائق</span>' : (canReviewOrder(o, 'driver', o.driverId) ? '<button class="btn btn-sm btn-warning" data-rate-driver-index="' + orderIndex + '"><i class="fas fa-star"></i> تقييم السائق</button>' : ''));

            '<div class="order-card-body">' + renderOrderProgress(meta) +

    });

function reorderItems(orderId) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order || !order.items || !order.items.length) return showToast('لا توجد منتجات لإعادة الطلب', 'error');
    let store = db.stores.find(function(item) { return String(item.id) === String(order.storeId); });
    if (!store || isStoreBlocked(store)) return showToast('لا يمكن إعادة الطلب لأن المتجر غير متاح حالياً.', 'warning', 4500);
    cart = JSON.parse(JSON.stringify(order.items)); appliedCoupon = null; updateCartBadge(); showToast('تمت إضافة منتجات الطلب إلى السلة'); navigate('cart');
}

function rateDriver(orderId) {
    let order = db.orders.find(function(item) { return String(item.id) === String(orderId); });
    if (!canReviewOrder(order, 'driver', order && order.driverId)) return showToast('يمكنك تقييم السائق بعد استلام طلب مكتمل من هذا الحساب فقط.', 'warning', 4500);
    selectedRating = 0;
    showModal("⭐ تقييم السائق", '<div style="text-align:center;padding:10px;"><p>قيّم السائق للطلب #' + escapeHtml(String(order.id).slice(-6)) + '</p><div style="font-size:2rem;letter-spacing:8px;cursor:pointer;" id="star-rating">' +
        '<span onclick="selectStar(1)">★</span><span onclick="selectStar(2)">★</span><span onclick="selectStar(3)">★</span><span onclick="selectStar(4)">★</span><span onclick="selectStar(5)">★</span></div>' +
        '<textarea id="driver-rating-comment" maxlength="500" placeholder="تعليقك (اختياري، حتى 500 حرف)" style="margin-top:15px;"></textarea></div>', 'confirm', function() {

    if (myStore) { myStore.isOpen = myStore.isOpen === false ? true : false; sync(); showToast(myStore.isOpen === false ? 'تم إغلاق المتجر 🔒' : 'تم فتح المتجر 🔓'); navigate('my-store'); }
}

function deleteMyStore() {

function editProduct(productId) {
    let store = db.stores.find(function(s) { return s.ownerId === currentUser.id; });
    let product = store.products.find(function(p) { return p.id === productId; });
    if (!product) return;
    tempImageBase64 = product.img || '';
    showModal("✏️ تعديل المنتج", '<input id="edit-prod-name" value="' + product.name + '" placeholder="اسم المنتج"><input id="edit-prod-price" type="number" value="' + product.price + '" placeholder="السعر"><textarea id="edit-prod-desc" placeholder="وصف المنتج">' + (product.description || '') + '</textarea><label>صورة جديدة (اختياري)</label><input type="file" accept="image/*" onchange="encodeImage(this)">', 'confirm', function() {
        let newName = document.getElementById('edit-prod-name') ? document.getElementById('edit-prod-name').value : '';
        let newPrice = document.getElementById('edit-prod-price') ? document.getElementById('edit-prod-price').value : '';
        let newDesc = document.getElementById('edit-prod-desc') ? document.getElementById('edit-prod-desc').value : '';
        if (!newName || !newPrice) return showToast('الرجاء إدخال الاسم والسعر', 'error');

}

function openAddProductModal(storeId) {
    tempImageBase64 = '';
    showModal("➕ إضافة منتج جديد", '<input id="add-prod-name" placeholder="اسم المنتج"><input id="add-prod-price" type="number" placeholder="السعر (د.ل)"><textarea id="add-prod-desc" placeholder="وصف المنتج (اختياري)"></textarea><label>صورة المنتج (اختياري)</label><input type="file" accept="image/*" onchange="encodeImage(this)">', 'confirm', function() {
        let name = document.getElementById('add-prod-name') ? document.getElementById('add-prod-name').value : '';
        let price = document.getElementById('add-prod-price') ? document.getElementById('add-prod-price').value : '';
        let desc = document.getElementById('add-prod-desc') ? document.getElementById('add-prod-desc').value : '';
        if (!name || !price) return showToast('الرجاء إدخال الاسم والسعر', 'error');
        let store = db.stores.find(function(s) { return s.id === storeId; });
        if (!store.products) store.products = [];
        store.products.push({ id: 'P'+Date.now(), name: name, price: parseInt(price), description: desc, img: tempImageBase64 });

function createMyStore() {
    let name = document.getElementById('new-store-name').value;
    let cat = document.getElementById('new-store-cat').value;
    if (!name) return showToast('أدخل اسم المتجر', 'error');
    let newStore = { id: 'S' + Date.now(), name: name, ownerId: currentUser.id, category: cat,
        img: tempImageBase64 || '', products: [], ratingSum: 0, ratingCount: 0, isOpen: true, reviews: [] };
    db.stores.push(newStore); sync();
    showToast('تم إنشاء المتجر بنجاح! 🎉'); navigate('my-store');
}

function acceptOrder(orderId) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order || !canManageOrders()) return showToast('ليس لديك صلاحية قبول الطلبات', 'error');
    let store = db.stores.find(function(s) { return s.id === order.storeId; });
    if (!isDeveloperUser() && (!store || store.ownerId !== currentUser.id)) return showToast('هذا الطلب ليس تابعاً لمتجرك', 'error');
    if (order.status !== 'قيد الانتظار ⏳') return showToast('الطلب لم يعد في حالة انتظار', 'warning');
    if (!firebaseDataLoaded || !firebaseConnected) return showToast('الحفظ متوقف حتى اكتمال الاتصال بقاعدة البيانات.', 'warning', 4000);
    var previousStatus = order.status;
    var acceptedStatus = 'تم القبول ✅ (بانتظار سائق)';
    var queuedNotifications = [];
    function queueNotification(userId, text) {
        var notification = addNotification(userId, text, '', true);
        if (notification) queuedNotifications.push({ userId:userId, notificationId:notification.id });
    }
    order.status = acceptedStatus;
    queueNotification(order.userId, 'تم قبول طلبك من المتجر وهو الآن بانتظار سائق');
    db.users.filter(function(user) { return user.type === 'driver'; }).forEach(function(driver) {
        queueNotification(driver.id, '🚀 طلب جديد في منطقتك من ' + order.userName);
    });
    sync().then(function(saved) {
        if (!saved) {
            var liveOrder = db.orders.find(function(item) { return item.id === orderId; });
            if (liveOrder && liveOrder.status === acceptedStatus) liveOrder.status = previousStatus;
            queuedNotifications.forEach(function(entry) {
                var target = db.users.find(function(user) { return user.id === entry.userId; });
                if (!target || !Array.isArray(target.notifications)) return;
                target.notifications = target.notifications.filter(function(item) { return item.id !== entry.notificationId; });
                if (!target.notifications.length) delete target.notifications;
            });
            if (isDeveloperUser()) renderSuperAdminPanel();
            else navigate('my-store');
            showToast('لم يؤكد Firebase حفظ الطلب، لذلك أُلغيت الحالة والإشعارات محلياً.', 'warning', 5000);
            return;
        }
        navigate(isDeveloperUser() ? 'dev' : 'my-store');
        showToast('تم قبول الطلب وحفظه بنجاح من لوحة ' + (isDeveloperUser() ? 'المطور' : 'المتجر'));
    });
}

function deleteProduct(pid) {
    let store = db.stores.find(function(s) { return s.ownerId === currentUser.id; });
    store.products = store.products.filter(function(p) { return p.id !== pid; });
    sync(); navigate('my-store'); showToast('تم حذف المنتج');
}

function setDriverOrderStatus(orderId, status) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order || order.driverId !== currentUser.id) return showToast('هذه المهمة ليست مسجلة باسمك', 'error');
    order.status = status;
    if (!order.orderChat) order.orderChat = [];
    order.orderChat.push({ sender:'system', text:'تحديث السائق: ' + status });
    addNotification(order.userId, status === 'وصلت للموقع 📍' ? 'السائق وصل إلى موقع التسليم' : 'السائق حدّث حالة طلبك إلى ' + status);
    sync(); navigate('driver'); showToast('تم تحديث حالة الطلب');
}

function copyDeliveryAddress(address) {
    if (navigator.clipboard) navigator.clipboard.writeText(address).then(function(){ showToast('تم نسخ العنوان'); }).catch(function(){ showToast('العنوان: ' + address); });
    else showToast('العنوان: ' + address);
}

function renderDriver(container) {

        return;
    }

    let available = db.orders.filter(function(o) { return o.status === 'تم القبول ✅ (بانتظار سائق)' && !o.driverId; }).slice().sort(byPriority);
    let myTasks = db.orders.filter(function(o) { return o.driverId === currentUser.id && String(o.status || '').indexOf('تسليم') === -1; }).slice().sort(byPriority);

    let todayCash = db.orders.filter(function(o) { return o.driverId === currentUser.id && o.deliveredAt && o.deliveredAt.slice(0,10) === today; }).reduce(function(sum, o) { return sum + Number(o.collectedAmount || o.total || 0); }, 0);
    let completionRate = (completedToday + myTasks.length) ? Math.round((completedToday / (completedToday + myTasks.length)) * 100) : 0;
    let driverRatingSummary = getDriverRatingSummary(currentUser);

    let avgRating = avgRatingValue ? avgRatingValue.toFixed(1) : 'جديد';
    let isOnline = !!firebaseConnected && !!firebaseDataLoaded && (typeof navigator === 'undefined' || navigator.onLine !== false);
    let safe = function(value) { return escapeHtml(value === undefined || value === null ? '' : String(value)); };
    let money = function(value) { let amount = Number(value || 0); return (isFinite(amount) ? amount : 0).toLocaleString('ar-LY', { maximumFractionDigits:2 }); };
    let timeLabel = function(value) { return value === '30' ? 'خلال 30 دقيقة' : value === '60' ? 'خلال ساعة' : value === '120' ? 'خلال ساعتين' : 'بأقرب وقت'; };

            if (section) section.scrollIntoView({ behavior:'smooth', block:'start' });

        }

function suggestHotZone() {

function pickOrderDriver(oid) {
    let order = db.orders.find(function(o) { return o.id === oid; });
    if (currentUser.type !== 'driver') return showToast('فعّل وضع السائق أولاً', 'error');
    if (!order) return showToast('الطلب غير موجود أو تم تحديثه', 'warning');
    if (order.driverId || order.status !== 'تم القبول ✅ (بانتظار سائق)') return showToast('هذا الطلب تم استلامه من سائق آخر أو لم يعد متاحاً', 'warning', 5000);
    var driverId = currentUser.id, driverName = currentUser.name;
    database.ref('appData/orders').transaction(function(raw) {
        var orders = dataArray(raw);
        var remoteOrder = orders.find(function(o) { return o && o.id === oid; });
        if (!remoteOrder || remoteOrder.driverId || remoteOrder.status !== 'تم القبول ✅ (بانتظار سائق)') return;
        remoteOrder.driverId = driverId;
        remoteOrder.status = 'جاري التوصيل 🛵';
        if (!remoteOrder.orderChat) remoteOrder.orderChat = [];
        remoteOrder.orderChat.push({ sender:'system', text:'تم تعيين السائق ' + driverName + ' للطلب' });
        return orders;
    }, function(error, committed, snapshot) {
        if (error) return showToast('تعذر استلام الطلب الآن. تحقق من الاتصال وحاول مرة أخرى.', 'error', 5500);
        if (!committed) return showToast('سبق أن استلم سائق آخر هذا الطلب.', 'warning', 5000);
        var savedOrders = dataArray(snapshot.val());
        var saved = savedOrders.find(function(o) { return o && o.id === oid; });
        var localIndex = db.orders.findIndex(function(o) { return o.id === oid; });
        if (saved && localIndex !== -1) db.orders[localIndex] = saved;
        if (saved) {
            addNotification(saved.userId, 'السائق ' + driverName + ' في طريقه إليك');
            var store = db.stores.find(function(s) { return s.id === saved.storeId; });
            if (store) addNotification(store.ownerId, 'السائق ' + driverName + ' استلم الطلب #' + saved.id.slice(-6));
        }
        sync(); navigate('driver'); showToast('تم استلام الطلب بنجاح 🛵');
    });
}

// ==================== التتبع الحي لموقع السائق ====================
function stopLiveLocationTracking(removeRemote) {
    if (activeLocationWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(activeLocationWatchId);
    }
    activeLocationWatchId = null;
    activeLocationOrderId = null;
    if (liveLocationRef && liveLocationListener) liveLocationRef.off('value', liveLocationListener);
    liveLocationRef = null;
    liveLocationListener = null;
    if (removeRemote && liveMapOrderId) database.ref('liveLocations/' + liveMapOrderId).remove().catch(function(){});
}

function formatLocationTime(value) {
    if (!value) return 'بانتظار موقع السائق';
    try { return 'آخر تحديث: ' + new Date(value).toLocaleTimeString('ar-LY'); } catch(e) { return 'تم تحديث الموقع'; }
}

function updateLiveMap(location) {
    if (!location || !location.lat || !location.lng) return;
    var point = [Number(location.lat), Number(location.lng)];
    if (liveMarker) liveMarker.setLatLng(point);
    else if (liveMap) liveMarker = L.marker(point).addTo(liveMap).bindPopup('موقع السائق');
    if (liveMap) {
        if (!liveMap._hasDriverLocation) { liveMap.setView(point, 16); liveMap._hasDriverLocation = true; }
        else liveMap.panTo(point, { animate:true, duration:.5 });
    }
    var status = document.getElementById('live-location-status');
    if (status) status.innerHTML = '<span class="live-dot"></span><span>السائق متصل • ' + formatLocationTime(location.updatedAt) + (location.accuracy ? ' • دقة ' + Math.round(location.accuracy) + 'م' : '') + '</span>';
}

function initLiveMap(orderId, isDriver) {
    var holder = document.getElementById('live-map-' + orderId);
    if (!holder || typeof L === 'undefined') return;
    if (liveMap) { liveMap.remove(); liveMap = null; liveMarker = null; }
    liveMapOrderId = orderId;
    liveMap = L.map(holder, { zoomControl:true, attributionControl:true, maxBounds:ZALTAN_MAP_BOUNDS, maxBoundsViscosity:0.9, minZoom:11, maxZoom:18 }).setView(ZALTAN_CENTER, 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(liveMap);
    if (isDriver) {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>جاري طلب إذن الموقع من الهاتف...</span>';
    }
    setTimeout(function(){ if (liveMap) liveMap.invalidateSize(); }, 250);
}

function startDriverLocationSharing(orderId) {
    if (!navigator.geolocation) {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>الموقع غير مدعوم على هذا الجهاز</span>';
        return;
    }
    if (activeLocationOrderId === orderId && activeLocationWatchId !== null) return;
    stopLiveLocationTracking(false);
    activeLocationOrderId = orderId;
    activeLocationWatchId = navigator.geolocation.watchPosition(function(pos) {
        var trackedOrder = db.orders.find(function(o) { return o.id === orderId; });
        var trackedStore = trackedOrder ? db.stores.find(function(s) { return s.id === trackedOrder.storeId; }) : null;
        var payload = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy || null, updatedAt: Date.now(), driverId: currentUser.id, driverName: currentUser.name, customerId: trackedOrder ? trackedOrder.userId : null, storeOwnerId: trackedStore ? trackedStore.ownerId : null };
        database.ref('liveLocations/' + orderId).set(payload).catch(function(){ showToast('تعذر تحديث موقعك حالياً', 'error', 2500); });
        updateLiveMap(payload);
    }, function() {
        var status = document.getElementById('live-location-status');
        if (status) status.innerHTML = '<span class="live-dot waiting"></span><span>يرجى السماح للتطبيق بالوصول إلى موقعك</span>';
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
}

function subscribeToDriverLocation(orderId) {
    if (liveLocationRef && liveLocationListener) liveLocationRef.off('value', liveLocationListener);
    liveLocationRef = database.ref('liveLocations/' + orderId);
    liveLocationListener = function(snapshot) {
        var location = snapshot.val();
        updateLiveMap(location);
        var status = document.getElementById('live-location-status');
        if (!location && status) status.innerHTML = '<span class="live-dot waiting"></span><span>بانتظار مشاركة موقع السائق...</span>';
    };
    liveLocationRef.on('value', liveLocationListener);
}

function goBackFromOrder() {
    if (!currentUser) return renderAuth();
    if (currentUser.type === 'driver') return navigate('driver');
    if (currentUser.type === 'store_owner') return navigate('my-store');
    return navigate('orders');
}

function sendTrackMsg(orderId) {
    let inp = document.getElementById('track-msg-input');
    if (!inp || !currentUser) return;
    if (!firebaseDataLoaded) return showToast('الاتصال غير متاح. أعد المحاولة بعد عودة المزامنة.', 'warning', 4000);
    let text = inp.value.trim();
    if (!text) return;
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order) return showToast('الطلب غير موجود', 'error');
    let store = db.stores.find(function(s) { return s.id === order.storeId; });
    let isParticipant = order.userId === currentUser.id || (store && store.ownerId === currentUser.id) || order.driverId === currentUser.id;
    if (!isParticipant) return showToast('غير مصرح بإرسال رسالة لهذا الطلب', 'error');
    if (!Array.isArray(order.orderChat)) order.orderChat = dataArray(order.orderChat);
    let timestamp = Date.now();
    let message = { id:'OM' + timestamp + Math.random().toString(36).slice(2, 7), sender:currentUser.id, text:text, ts:timestamp };
    order.orderChat.push(message);
    let recipientIds = [order.userId, store && store.ownerId, order.driverId].filter(function(id, index, list) { return id && id !== currentUser.id && list.indexOf(id) === index; });
    let notifications = [];
    recipientIds.forEach(function(userId) {
        let notification = addNotification(userId, 'رسالة جديدة في الطلب #' + String(orderId).slice(-6), 'track:' + orderId, true);
        if (notification) notifications.push({ userId:userId, id:notification.id });
    });
    let saveResult = sync();
    navigate('track', orderId);
    saveResult.then(function(saved) {
        if (!saved) {
            let currentOrder = db.orders.find(function(item) { return item.id === orderId; });
            if (currentOrder && Array.isArray(currentOrder.orderChat)) currentOrder.orderChat = currentOrder.orderChat.filter(function(item) { return item.id !== message.id; });
            notifications.forEach(function(entry) {
                let recipient = db.users.find(function(user) { return user.id === entry.userId; });
                if (recipient && Array.isArray(recipient.notifications)) recipient.notifications = recipient.notifications.filter(function(item) { return item.id !== entry.id; });
            });
            navigate('track', orderId);
            return;
        }
        showToast('تم إرسال رسالة الطلب', 'success', 1800);
    });
}

function renderMail(container) {
    let notifs = (currentUser.notifications || []).slice().sort(function(a, b) { return (Number(b.ts) || 0) - (Number(a.ts) || 0); });
    let chats = db.chats.filter(function(chat) { return chat.u1 === currentUser.id || chat.u2 === currentUser.id; })
        .slice().sort(function(a, b) { return getChatTimestamp(b) - getChatTimestamp(a); });
    let unreadChats = chats.reduce(function(total, chat) { return total + getChatUnreadCount(chat); }, 0);
    let notifHtml = notifs.map(function(n) {
        return '<button type="button" class="notification-card ' + (n.read ? 'is-read' : '') + '" data-notification-id="' + escapeHtml(n.id) + '">' +
            '<span class="notification-dot" aria-hidden="true"></span><span class="notification-copy"><b>🔔 ' + escapeHtml(n.text) + '</b>' +
            '<small>' + escapeHtml(n.date || '') + '</small></span></button>';
    }).join('');
    let chatHtml = chats.map(function(chat) {
        let otherId = chat.u1 === currentUser.id ? chat.u2 : chat.u1;
        let other = db.users.find(function(user) { return user.id === otherId; }) || {name:'مستخدم'};
        let last = getChatLastMessage(chat);
        let preview = last ? String(last.txt || last.text || '') : 'ابدأ المحادثة';

        let time = getChatTimestamp(chat) ? formatChatTime(getChatTimestamp(chat)) : '';

    }).join('');
    container.innerHTML = '<div class="animate-fade mail-page"><div class="mail-heading"><div><span class="eyebrow">مركز التواصل</span><h3>الرسائل والإشعارات</h3></div>' +
