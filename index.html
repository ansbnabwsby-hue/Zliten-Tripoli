        '<section class="mail-section"><div class="mail-section-title"><h4>المحادثات</h4><span>' + chats.length + '</span></div>' +
        '<label class="mail-search"><i class="fas fa-search" aria-hidden="true"></i><input id="chat-search" type="search" placeholder="ابحث باسم أو رسالة..."></label>' +
        '<div id="chat-list" class="chat-list">' + (chatHtml || '<div class="empty-state"><i class="fas fa-comments"></i><p>لا توجد محادثات بعد</p><small>تواصل مع متجر أو مستخدم لبدء محادثة.</small></div>') +
        '</div><p id="chat-search-empty" class="empty-search" hidden>لا توجد محادثة تطابق البحث.</p></section>' +
        '<section class="mail-section"><div class="mail-section-title"><h4>الإشعارات</h4><span>' + notifs.filter(function(n) { return !n.read; }).length + ' غير مقروءة</span></div>' +
        '<button type="button" class="btn btn-sm btn-outline" id="mark-all-notifications"><i class="fas fa-check-double"></i> تعليم الكل كمقروء</button>' +
        '<div class="notification-list">' + (notifHtml || '<p class="muted-empty">لا توجد إشعارات جديدة.</p>') + '</div></section></div>';

    let searchInput = container.querySelector('#chat-search');
    if (searchInput) searchInput.addEventListener('input', function() { filterChatCards(this.value); });
    container.querySelectorAll('[data-open-chat]').forEach(function(button) {
        button.addEventListener('click', function() { navigate('chat', button.getAttribute('data-open-chat')); });
    });
    container.querySelectorAll('[data-delete-chat]').forEach(function(button) {
        button.addEventListener('click', function() { deleteChat(button.getAttribute('data-delete-chat')); });
    });
    container.querySelectorAll('[data-notification-id]').forEach(function(button) {
        button.addEventListener('click', function() { markNotifRead(button.getAttribute('data-notification-id')); });
    });
    let markAllButton = container.querySelector('#mark-all-notifications');
    if (markAllButton) markAllButton.addEventListener('click', markAllNotifRead);
}

function filterChatCards(query) {
    let normalized = String(query || '').trim().toLocaleLowerCase('ar');
    let visible = 0;
    document.querySelectorAll('#chat-list [data-chat-item]').forEach(function(item) {
        let matches = item.textContent.toLocaleLowerCase('ar').indexOf(normalized) !== -1;
        item.hidden = !matches;
        if (matches) visible++;
    });
    let empty = document.getElementById('chat-search-empty');
    if (empty) empty.hidden = visible > 0 || !normalized;
}

function markNotifRead(id) {
    if (!firebaseDataLoaded) return showToast('الاتصال غير متاح؛ تعذر حفظ حالة القراءة.', 'warning');
    if (!Array.isArray(currentUser.notifications)) currentUser.notifications = dataArray(currentUser.notifications);
    let notif = currentUser.notifications.find(function(n) { return n.id === id; });
    let wasRead = notif ? !!notif.read : false;
    if (notif) notif.read = true;
    let u = db.users.find(function(u) { return u.id === currentUser.id; });
    if (u) u.notifications = currentUser.notifications;
    sync().then(function(saved) {
        if (!saved && notif) notif.read = wasRead;
        updateNotifyBadge();
        if (notif && notif.link && notif.link.indexOf('chat:') === 0) navigate('chat', notif.link.slice(5));
        else if (notif && notif.link && notif.link.indexOf('track:') === 0) navigate('track', notif.link.slice(6));
        else navigate('mail');
    });
}

function markAllNotifRead() {
    if (!firebaseDataLoaded) return showToast('الاتصال غير متاح؛ تعذر حفظ حالة القراءة.', 'warning');
    if (!Array.isArray(currentUser.notifications)) currentUser.notifications = dataArray(currentUser.notifications);
    let previous = (currentUser.notifications || []).map(function(n) { return !!n.read; });
    currentUser.notifications.forEach(function(n) { n.read = true; });
    sync().then(function(saved) {
        if (!saved) currentUser.notifications.forEach(function(n, index) { n.read = previous[index]; });
        updateNotifyBadge(); navigate('mail');
        if (saved) showToast('تم تعليم جميع الإشعارات كمقروءة');
    });
}

function renderFullChat(container, otherId) {
    if (!otherId || otherId === currentUser.id) { showToast('المستخدم المطلوب غير صالح', 'error'); return navigate('mail'); }
    let chat = db.chats.find(function(item) { return (item.u1 === currentUser.id && item.u2 === otherId) || (item.u2 === currentUser.id && item.u1 === otherId); });
    if (!chat) {
        let chatId = [currentUser.id, otherId].sort().join('_');
        chat = { id:chatId, u1:currentUser.id, u2:otherId, msgs:[], lastReadAt:{} };
        db.chats.push(chat);
    }
    if (!Array.isArray(chat.msgs)) chat.msgs = dataArray(chat.msgs);
    let other = db.users.find(function(u) { return u.id === otherId; }) || {name: 'مستخدم'};
    let previousBox = document.getElementById('chat-box');
    let keepAtBottom = !previousBox || previousBox.scrollHeight - previousBox.scrollTop - previousBox.clientHeight < 90;
    let previousScrollTop = previousBox ? previousBox.scrollTop : 0;
    let previousInput = document.getElementById('msg-input');
    let draft = previousInput ? previousInput.value : (chatDrafts[chat.id] || '');
    let messages = getChatMessages(chat);
    let readAt = Number(chat.lastReadAt && chat.lastReadAt[currentUser.id]) || 0;
    let previousReadAt = readAt;
    let newestUnread = messages.reduce(function(latest, message) {
        return message.s !== currentUser.id && message.s !== 'system' && Number(message.ts) > latest ? Number(message.ts) : latest;
    }, readAt);
    let hadUnread = newestUnread > readAt;
    let canMarkRead = hadUnread && firebaseDataLoaded && firebaseConnected;
    if (canMarkRead) {
        if (!chat.lastReadAt || typeof chat.lastReadAt !== 'object') chat.lastReadAt = {};
        chat.lastReadAt[currentUser.id] = newestUnread;
    }
    let messageHtml = messages.map(function(message) {
        let text = escapeHtml(message.txt || message.text || '');
        if (message.s === 'system') return '<div class="chat-bubble bubble-system">' + text + '</div>';
        let mine = message.s === currentUser.id;
        let seen = mine && Number(chat.lastReadAt && chat.lastReadAt[otherId]) >= Number(message.ts) && Number(message.ts) > 0;
        return '<div class="chat-bubble ' + (mine ? 'bubble-left' : 'bubble-right') + '"><span class="chat-message-text">' + text + '</span>' +
            '<span class="chat-message-meta">' + escapeHtml(formatChatTime(message.ts)) + (mine ? '<span class="chat-read-state">' + (seen ? 'مقروءة ✓✓' : 'أُرسلت ✓') + '</span>' : '') + '</span></div>';
    }).join('');
    container.innerHTML = '<div class="animate-fade chat-page"><div class="chat-header"><button type="button" class="btn btn-sm btn-outline" id="chat-back"><i class="fas fa-arrow-right"></i><span>الرسائل</span></button>' +
        '<span class="avatar-circle">' + escapeHtml((other.name || 'م').charAt(0)) + '</span><div class="chat-contact"><b>' + escapeHtml(other.name || 'مستخدم') + '</b><small>' + escapeHtml(other.type || 'مستخدم') + '</small></div></div>' +
        '<div id="chat-box" class="chat-box" aria-live="polite">' + (messageHtml || '<div class="chat-empty"><i class="fas fa-comment-dots"></i><b>ابدأ المحادثة</b><span>اكتب رسالتك، وستظهر للطرف الآخر بعد المزامنة.</span></div>') + '</div>' +
        '<div class="chat-quick-replies"><button type="button" data-chat-reply="السلام عليكم">السلام عليكم</button><button type="button" data-chat-reply="تمام، شكراً">تمام، شكراً</button><button type="button" data-chat-reply="هل ما زال متاحاً؟">هل ما زال متاحاً؟</button></div>' +
        '<form id="chat-form" class="chat-composer"><textarea id="msg-input" rows="1" maxlength="1000" placeholder="اكتب رسالتك..." aria-label="اكتب رسالتك"></textarea>' +
        '<button type="submit" class="btn btn-primary" id="send-chat-button" aria-label="إرسال الرسالة"><i class="fas fa-paper-plane"></i></button></form>' +
        '<small class="chat-hint">Enter للإرسال · Shift+Enter لسطر جديد · الرسائل القديمة لا تحمل وقتاً دقيقاً.</small></div>';
    let input = container.querySelector('#msg-input');
    let sendButton = container.querySelector('#send-chat-button');
    input.value = draft;
    input.addEventListener('input', function() {
        chatDrafts[chat.id] = input.value;
        input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        sendButton.disabled = !input.value.trim();
    });
    sendButton.disabled = !input.value.trim();
    container.querySelector('#chat-form').addEventListener('submit', function(event) { event.preventDefault(); sendMsg(chat.id); });
    input.addEventListener('keydown', function(event) { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMsg(chat.id); } });
    container.querySelector('#chat-back').addEventListener('click', function() { navigate('mail'); });
    container.querySelectorAll('[data-chat-reply]').forEach(function(button) {
        button.addEventListener('click', function() { input.value = button.getAttribute('data-chat-reply'); input.dispatchEvent(new Event('input', {bubbles:true})); sendMsg(chat.id); });
    });
    setTimeout(function() {
        let box = document.getElementById('chat-box');
        if (box) box.scrollTop = keepAtBottom ? box.scrollHeight : previousScrollTop;
    }, 0);
    if (canMarkRead) sync().then(function(saved) {
        if (saved) return;
        let liveChat = db.chats.find(function(item) { return item.id === chat.id; });
        if (liveChat && liveChat.lastReadAt) {
            if (previousReadAt) liveChat.lastReadAt[currentUser.id] = previousReadAt;
            else delete liveChat.lastReadAt[currentUser.id];
        }
        if (activePage === 'chat' && activePageParam === otherId) navigate('chat', otherId);
    });
}

function sendMsg(cid) {
    let inp = document.getElementById('msg-input');
    if (!inp || !currentUser) return;
    if (!firebaseDataLoaded) return showToast('الاتصال غير متاح. أعد المحاولة بعد عودة المزامنة.', 'warning', 4000);
    let text = inp.value.trim();
    if (!text) return;
    let chat = db.chats.find(function(c) { return c.id === cid; });
    if (!chat || (chat.u1 !== currentUser.id && chat.u2 !== currentUser.id)) return showToast('تعذر العثور على المحادثة', 'error');
    let otherId = chat.u1 === currentUser.id ? chat.u2 : chat.u1;
    if (!Array.isArray(chat.msgs)) chat.msgs = dataArray(chat.msgs);
    let timestamp = Date.now();
    let message = { id:'M' + timestamp + Math.random().toString(36).slice(2, 7), s:currentUser.id, txt:text, ts:timestamp };
    let previousLastMessageAt = chat.lastMessageAt;
    chat.msgs.push(message);
    chat.lastMessageAt = timestamp;
    chatDrafts[chat.id] = '';
    let notification = addNotification(otherId, 'رسالة جديدة من ' + currentUser.name, 'chat:' + currentUser.id, true);
    let saveResult = sync();
    navigate('chat', otherId);
    saveResult.then(function(saved) {
        if (saved) { showToast('تم إرسال الرسالة', 'success', 1800); return; }
        let liveChat = db.chats.find(function(item) { return item.id === cid; });
        if (liveChat) {
            liveChat.msgs = getChatMessages(liveChat).filter(function(item) { return item.id !== message.id; });
            if (liveChat.lastMessageAt === timestamp) {
                let lastRemaining = getChatLastMessage(liveChat);
                if (previousLastMessageAt) liveChat.lastMessageAt = previousLastMessageAt;
                else if (lastRemaining && lastRemaining.ts) liveChat.lastMessageAt = lastRemaining.ts;
                else delete liveChat.lastMessageAt;
            }
        }
        if (notification) {
            let recipient = db.users.find(function(user) { return user.id === otherId; });
            if (recipient) recipient.notifications = (recipient.notifications || []).filter(function(item) { return item.id !== notification.id; });
        }
        chatDrafts[cid] = text;
        if (activePage === 'chat' && activePageParam === otherId) navigate('chat', otherId);
    });
}

function deleteChat(cid) {
    let chat = db.chats.find(function(item) { return item.id === cid; });
    if (!chat || (chat.u1 !== currentUser.id && chat.u2 !== currentUser.id)) return showToast('المحادثة غير موجودة', 'error');
    if (!firebaseDataLoaded) return showToast('لا يمكن حذف المحادثة دون اتصال مباشر بقاعدة البيانات.', 'warning', 4500);
    showModal("حذف المحادثة نهائياً", "سيؤدي الحذف إلى إزالة سجل المحادثة للطرفين. هل تريد المتابعة؟", "confirm", function() {
        let previous = db.chats;
        db.chats = db.chats.filter(function(c) { return c.id !== cid; });
        sync().then(function(saved) {
            if (!saved) { db.chats = previous; navigate('mail'); return; }
            navigate('mail'); showToast('تم حذف المحادثة للطرفين');
        });
    });
}

function sendSupportMsg() {
    let inp = document.getElementById('support-input');
    if (!inp.value.trim()) return;
    let chat = document.getElementById('support-chat');
    chat.innerHTML += '<div class="chat-bubble bubble-left" style="align-self:flex-end;"><b>أنت:</b> ' + inp.value + '</div>';
    let reply = getBotReply(inp.value);
    setTimeout(function() {
        chat.innerHTML += '<div class="chat-bubble bubble-right" style="align-self:flex-start;background:var(--card-hover);border:1px solid var(--border);"><b>🤖 بوت زلطن:</b> ' + reply + '</div>';
        chat.scrollTop = chat.scrollHeight;
    }, 600);
    inp.value = '';
    chat.scrollTop = chat.scrollHeight;
}

function getBotReply(msg) {
    msg = msg.toLowerCase();
    if (msg.indexOf('طلب') !== -1 || msg.indexOf('order') !== -1) return 'للطلب: اختر المتجر، أضف المنتجات للسلة، ثم أكد الطلب.';
    if (msg.indexOf('سائق') !== -1 || msg.indexOf('driver') !== -1) return 'للتسجيل كسائق: سجل حسابك كسائق ثم فعل وضع السائق من قائمة التوصيل.';
    if (msg.indexOf('متجر') !== -1 || msg.indexOf('store') !== -1) return 'لفتح متجر: سجل كتاجر ثم اضغط على متجري في القائمة.';
    if (msg.indexOf('توصيل') !== -1 || msg.indexOf('delivery') !== -1) return 'مدة التوصيل تتراوح بين 15-45 دقيقة حسب المسافة.';
    if (msg.indexOf('خصم') !== -1 || msg.indexOf('كوبون') !== -1 || msg.indexOf('coupon') !== -1) return 'يمكنك الحصول على كوبونات خصم من قسم الكوبونات في الصفحة الرئيسية.';
    if (msg.indexOf('سلام') !== -1 || msg.indexOf('أهلا') !== -1 || msg.indexOf('مرحبا') !== -1) return 'أهلاً وسهلاً! 🎉 كيف يمكنني مساعدتك؟';
    return 'شكراً لتواصلك! إذا لم تجب إجابتك هنا، يمكنك استخدام زر الإبلاغ للتواصل مع الإدارة.';
}

function repairUserIds() {
    if (!requireDeveloperWrite()) return;
    var previousUsers = db.users.map(function(user) { return Object.assign({}, user); });
    var previousUser = currentUser;
    var previousStoredId = localStorage.getItem('z_user_id');
    db.users = uniqueUserRecords(db.users);
    if (currentUser) {
        var email = String(currentUser.email || currentUser.authEmail || '').toLowerCase();
        var updatedCurrentUser = currentUser.authUid ? db.users.find(function(user) { return user.authUid === currentUser.authUid; }) : null;
        if (!updatedCurrentUser && email) updatedCurrentUser = db.users.find(function(user) { return String(user.email || user.authEmail || '').toLowerCase() === email; });
        if (!updatedCurrentUser) updatedCurrentUser = db.users.find(function(user) { return user.id === currentUser.id; });
        if (updatedCurrentUser) {
            currentUser = updatedCurrentUser;
            localStorage.setItem('z_user_id', updatedCurrentUser.id);
        }
    }
    persistDevChange('تم إنشاء IDs ثابتة للمستخدمين وحفظها', function() {
        db.users = previousUsers;
        if (previousUser) {
            var previousEmail = String(previousUser.email || previousUser.authEmail || '').toLowerCase();
            var restoredUser = previousUser.authUid ? db.users.find(function(user) { return user.authUid === previousUser.authUid; }) : null;
            if (!restoredUser && previousEmail) restoredUser = db.users.find(function(user) { return String(user.email || user.authEmail || '').toLowerCase() === previousEmail; });
            if (!restoredUser) restoredUser = db.users.find(function(user) { return user.id === previousUser.id; });
            currentUser = restoredUser || previousUser;
        } else currentUser = null;
        if (previousStoredId) localStorage.setItem('z_user_id', previousStoredId);
        else localStorage.removeItem('z_user_id');
    });
}

function setDevPanelTab(tab) {
    var allowed = ['overview', 'orders', 'reports', 'catalog', 'users'];
    if (!allowed.includes(tab) || !isDeveloperUser()) return;
    devPanelTab = tab; devPanelSearch = ''; renderSuperAdminPanel();
}

function persistDevChange(successMessage, rollback) {
    return sync().then(function(saved) {
        if (saved) showToast(successMessage);
        else if (typeof rollback === 'function') rollback();
        renderSuperAdminPanel();
        return saved;
    });
}

function filterDevPanel(query) {
    devPanelSearch = String(query || '');
    var normalized = devPanelSearch.trim().toLocaleLowerCase('ar');
    var rows = Array.from(document.querySelectorAll('#dev-list [data-dev-searchable]'));
    var visible = 0;
    rows.forEach(function(row) {
        var matches = row.textContent.toLocaleLowerCase('ar').indexOf(normalized) !== -1;
        row.hidden = !matches;
        if (matches) visible++;
    });
    var count = document.getElementById('dev-results-count');
    if (count) count.textContent = visible + ' نتيجة';
    var empty = document.getElementById('dev-no-results');
    if (empty) empty.hidden = visible > 0 || !rows.length;
}

function bindDevPanelActions(root) {
    root.querySelectorAll('[data-dev-tab]').forEach(function(button) {
        if (button.dataset.devBound) return;
        button.dataset.devBound = 'true';
        button.addEventListener('click', function() { setDevPanelTab(button.getAttribute('data-dev-tab')); });
    });
    root.querySelectorAll('[data-dev-action]').forEach(function(button) {
        if (button.dataset.devBound) return;
        button.dataset.devBound = 'true';
        button.addEventListener('click', function() {
            var action = button.getAttribute('data-dev-action');
            var id = button.getAttribute('data-id');
            if (action === 'accept-order') devAcceptOrder(id);
            else if (action === 'delete-order') devDeleteOrder(id);
            else if (action === 'report-status') devUpdateReportStatus(id);
            else if (action === 'delete-report') devDeleteReport(id);
            else if (action === 'toggle-store') devToggleStore(id);
            else if (action === 'toggle-store-block') devToggleStoreBlock(id);
            else if (action === 'delete-store') devDeleteStore(id);
            else if (action === 'edit-product') devEditProduct(button.getAttribute('data-store-id'), button.getAttribute('data-product-id'));
            else if (action === 'delete-product') devDeleteProduct(button.getAttribute('data-store-id'), button.getAttribute('data-product-id'));
            else if (action === 'save-ad') saveDevAnnouncement();
            else if (action === 'save-policy') saveDevPolicy();
            else if (action === 'send-notification') sendDevNotification();
            else if (action === 'add-coupon') devAddCoupon();
            else if (action === 'add-store') devAddStore();
            else if (action === 'add-product') devShowAddProduct();
            else if (action === 'refresh') loadData();
        });
    });
    var search = root.querySelector('#dev-panel-search');
    if (search && !search.dataset.devBound) {
        search.dataset.devBound = 'true';
        search.value = devPanelSearch;
        search.addEventListener('input', function() { filterDevPanel(search.value); });
        filterDevPanel(search.value);
    }
}

function captureStoreBlockState(store) {
    var fields = ['isBlocked', 'blockedAt', 'unblockedAt'];
    var snapshot = {};
    fields.forEach(function(field) { snapshot[field] = { exists:Object.prototype.hasOwnProperty.call(store, field), value:store[field] }; });
    return snapshot;
}

function restoreStoreBlockState(store, snapshot) {
    Object.keys(snapshot).forEach(function(field) {
        if (snapshot[field].exists) store[field] = snapshot[field].value;
        else delete store[field];
    });
}

}

// ==================== برنامج الولاء (Loyalty) ====================
function getLoyaltyPoints() {
    let orders = db.orders.filter(function(o) { return o.userId === currentUser.id && o.status.indexOf('تسليم') !== -1; });
    return orders.length * 10;
}

function renderLoyalty(container) {
    let points = getLoyaltyPoints();
    let level = points < 50 ? '🥉 برونزي' : points < 150 ? '🥈 فضي' : points < 300 ? '🥇 ذهبي' : '💎 بلاتيني';
    let nextLevel = points < 50 ? 50 : points < 150 ? 150 : points < 300 ? 300 : 500;
    let progress = Math.min((points / nextLevel) * 100, 100);
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🏆 برنامج الولاء</h3>' +
        '<div class="card card-gradient-1" style="text-align:center;">' +
        '<div style="font-size:3rem;margin-bottom:10px;">🏆</div>' +
        '<h2 style="font-size:2rem;">' + points + ' نقطة</h2>' +
        '<p style="font-size:1.1rem;margin:8px 0;">المستوى: <b>' + level + '</b></p>' +
        '<div style="background:rgba(255,255,255,0.2);border-radius:10px;height:12px;margin:12px 0;overflow:hidden;">' +
        '<div style="background:white;height:100%;border-radius:10px;width:' + progress + '%;transition:width 0.5s;"></div></div>' +
        '<p style="font-size:0.85rem;">' + (nextLevel - points) + ' نقطة للمستوى التالي</p></div>' +
        '<div class="card"><h4 style="margin-bottom:12px;">🎁 مكافآت متاحة</h4>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        (points >= 50 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(50)">🎟️ كوبون 10% (50 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>🎟️ كوبون 10% (50 نقطة) - غير متاح</button>') +
        (points >= 100 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(100)">🚚 توصيل مجاني (100 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>🚚 توصيل مجاني (100 نقطة) - غير متاح</button>') +
        (points >= 200 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(200)">💰 خصم 20 د.ل (200 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>💰 خصم 20 د.ل (200 نقطة) - غير متاح</button>') +
        '</div></div>' +
        '<div class="card" style="text-align:center;color:var(--text-muted);"><p>💡 تحصل على 10 نقاط مقابل كل طلب مكتمل</p></div></div>';
}

function redeemReward(cost) {
    let points = getLoyaltyPoints();
    if (points < cost) return showToast('نقاط غير كافية', 'error');
    let code = 'LOYAL' + Date.now().toString().slice(-4);
    if (!db.coupons) db.coupons = [];
    let discount = cost === 50 ? 10 : cost === 100 ? 100 : 20;
    db.coupons.push({ id: 'C' + Date.now(), name: 'مكافأة ولاء', code: code, discount: discount, active: true, type: 'loyalty' });
    sync(); showToast('تم استبدال ' + cost + ' نقطة بمكافأة! الكود: ' + code + ' 🎉');
    navigate('loyalty');
}

// ==================== العروض والتخفيضات (Deals) ====================
function renderDeals(container) {
    let deals = [];
    db.stores.forEach(function(s) {
        if (isStoreBlocked(s)) return;
        if (s.products) {
            s.products.forEach(function(p) {
                if (p.dealPrice && p.dealPrice < p.price) {
                    deals.push({ store: s, product: p });
                }
            });
        }
    });
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🔥 عروض اليوم</h3>';
    if (!deals.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-percentage"></i><p>لا توجد عروض حالياً</p></div></div>';
        return;
    }
    deals.forEach(function(d) {
        let discount = Math.round(((d.product.price - d.product.dealPrice) / d.product.price) * 100);
        container.innerHTML += '<div class="card animate-fade" style="display:flex;gap:12px;align-items:center;">' +
            (d.product.img ? '<img src="' + d.product.img + '" class="product-img">' : '<div class="product-img" style="background:var(--gradient-2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🔥</div>') +
            '<div style="flex:1;">' +
            '<b>' + d.product.name + '</b><br>' +
            '<small style="color:var(--text-muted)">من ' + d.store.name + '</small><br>' +
            '<span style="text-decoration:line-through;color:var(--text-muted);">' + d.product.price + ' د.ل</span> ' +
            '<span style="color:var(--success);font-weight:700;font-size:1.2rem;">' + d.product.dealPrice + ' د.ل</span> ' +
            '<span class="tag tag-danger" style="background:rgba(231,76,60,0.2);color:var(--danger);">-' + discount + '%</span></div>' +
            '<button class="btn btn-sm btn-warning" onclick="addToCart(\'' + d.store.id + '\',\'' + d.product.name.replace(/\'/g, "\\'") + '\',' + d.product.dealPrice + ',\'' + (d.product.img || '') + '\');showToast(\'تمت الإضافة للسلة\')">شراء</button></div>';
    });
    container.innerHTML += '</div>';
}

// ==================== إعادة الطلب السريع ====================
function renderQuickReorder(container) {
    let myOrders = db.orders.filter(function(o) { return o.userId === currentUser.id && o.status.indexOf('تسليم') !== -1; }).reverse().slice(0, 5);
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🔄 إعادة الطلب السريع</h3>';
    if (!myOrders.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-history"></i><p>لا توجد طلبات سابقة</p></div></div>';
        return;
    }
    myOrders.forEach(function(o) {
        let store = db.stores.find(function(s) { return s.id === o.storeId; });
        container.innerHTML += '<div class="card animate-fade">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<b>' + (store ? store.name : 'متجر') + '</b><span style="color:var(--text-muted);font-size:0.8rem;">' + o.createdAt + '</span></div>' +
            '<div style="color:var(--text-muted);font-size:0.85rem;margin-bottom:10px;">' + o.items.map(function(i){return i.name;}).join(', ') + '</div>' +
            '<div style="display:flex;gap:8px;justify-content:space-between;align-items:center;">' +
            '<span style="color:var(--success);font-weight:700;">' + (o.total || 0) + ' د.ل</span>' +
            '<button class="btn btn-sm btn-primary" onclick="reorder(\'' + o.id + '\')"><i class="fas fa-redo"></i> إعادة الطلب</button></div></div>';
    });
    container.innerHTML += '</div>';
}

function reorder(orderId) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order) return;
    let store = db.stores.find(function(item) { return String(item.id) === String(order.storeId); });
    if (!store || isStoreBlocked(store)) return showToast('لا يمكن إعادة الطلب لأن المتجر غير متاح حالياً.', 'warning', 4500);
    cart = JSON.parse(JSON.stringify(order.items));
    updateCartBadge();
    showToast('تم نسخ المنتجات للسلة 🛒');
    navigate('cart');
}

// ==================== مشاركة المتجر ====================
function shareStore(storeId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    if (!store) return;
    let text = 'تفضل بزيارة متجر ' + store.name + ' على زلطن تريبول! 🚀';
    if (navigator.share) {
        navigator.share({ title: store.name, text: text, url: window.location.href });
    } else {
        if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + window.location.href).then(function() { showToast('تم نسخ رابط المتجر 📋'); });
        else showToast(text);
    }
}

// ==================== QR Code للمتجر (محاكاة) ====================
function showStoreQR(storeId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    if (!store) return;
    showModal("📱 QR Code - " + store.name, '<div style="text-align:center;"><div style="width:200px;height:200px;background:var(--card);border:2px solid var(--primary);border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:4rem;">📱</div><p style="margin-top:12px;color:var(--text-muted);">امسح الكود للدخول للمتجر مباشرة</p><button class="btn btn-sm btn-outline" style="margin-top:8px;width:auto;" onclick="shareStore(\'' + storeId + '\')"><i class="fas fa-share-alt"></i> مشاركة</button></div>');
}

// ==================== إحصائيات السائق الشهرية ====================
function renderDriverStats(container) {
    if (currentUser.type !== 'driver') return navigate('driver');
    let driverRatingSummary = getDriverRatingSummary(currentUser);
    let myDeliveries = db.orders.filter(function(o) { return o.driverId === currentUser.id && o.status.indexOf('تسليم') !== -1; });
    let monthlyRevenue = {};
    myDeliveries.forEach(function(o) {
        let month = o.createdAt ? o.createdAt.split('/')[1] + '/' + o.createdAt.split('/')[2] : 'غير معروف';
        monthlyRevenue[month] = (monthlyRevenue[month] || 0) + (o.total || 0);
    });
    let totalDeliveries = myDeliveries.length;
    let totalEarnings = myDeliveries.reduce(function(s, o) { return s + (o.total || 0); }, 0);
    let avgPerDelivery = totalDeliveries ? (totalEarnings / totalDeliveries).toFixed(1) : 0;

    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">📊 إحصائياتي</h3>' +
        '<div class="grid-2" style="margin-bottom:16px;">' +
        '<div class="stat-card"><div class="stat-value">' + totalDeliveries + '</div><div class="stat-label">📦 إجمالي التوصيلات</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + totalEarnings + '</div><div class="stat-label">💰 إجمالي الأرباح</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + avgPerDelivery + '</div><div class="stat-label">📊 متوسط الطلب</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + driverRatingSummary.count + '</div><div class="stat-label">⭐ عدد التقييمات</div></div></div>' +
        '<div class="card"><h4 style="margin-bottom:12px;">📈 الأرباح الشهرية</h4>' +
        Object.keys(monthlyRevenue).map(function(m) {
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">' +
                '<span>' + m + '</span><span style="color:var(--success);font-weight:700;">' + monthlyRevenue[m] + ' د.ل</span></div>';
        }).join('') || '<p style="color:var(--text-muted)">لا بيانات كافية</p>' +
        '</div></div>';
}

// ==================== المفضلة للمنتجات (Wishlist) ====================
let wishlist = JSON.parse(localStorage.getItem('z_wishlist') || '[]');

function toggleWishlist(productId, storeId) {
    let idx = wishlist.findIndex(function(w) { return w.pid === productId && w.sid === storeId; });
    if (idx > -1) { wishlist.splice(idx, 1); showToast('تم الإزالة من قائمة الأمنيات'); }
    else { wishlist.push({ pid: productId, sid: storeId, date: Date.now() }); showToast('تم الإضافة لقائمة الأمنيات 💙'); }
    localStorage.setItem('z_wishlist', JSON.stringify(wishlist));
}

function renderWishlist(container) {
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">💙 قائمة الأمنيات</h3>';
    let visibleWishlist = wishlist.filter(function(item) {
        let store = db.stores.find(function(candidate) { return String(candidate.id) === String(item.sid); });
        return store && !isStoreBlocked(store) && (store.products || []).some(function(product) { return product && String(product.id) === String(item.pid); });
    });
    if (!visibleWishlist.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-bookmark"></i><p>لا توجد منتجات متاحة في قائمة الأمنيات حالياً</p></div></div>';
        return;
    }
    visibleWishlist.forEach(function(w) {
        let store = db.stores.find(function(s) { return String(s.id) === String(w.sid); });
        let product = store && store.products ? store.products.find(function(p) { return String(p.id) === String(w.pid); }) : null;
        if (!product) return;
        container.innerHTML += '<div class="card animate-fade" style="display:flex;gap:12px;align-items:center;">' +
            (product.img ? '<img src="' + product.img + '" class="product-img">' : '<div class="product-img" style="background:var(--gradient-1);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📦</div>') +
            '<div style="flex:1;"><b>' + product.name + '</b><br><small style="color:var(--text-muted)">من ' + (store ? store.name : 'متجر') + '</small><br>' +
            '<span style="color:var(--success);font-weight:700;">' + product.price + ' د.ل</span></div>' +
            '<div style="display:flex;gap:8px;flex-direction:column;">' +
            '<button class="btn btn-sm btn-primary" onclick="addToCart(\'' + w.sid + '\',\'' + product.name.replace(/\'/g, "\\'") + '\',' + product.price + ',\'' + (product.img || '') + '\');showToast(\'تمت الإضافة\')">شراء</button>' +
            '<button class="btn btn-sm btn-ghost" onclick="toggleWishlist(\'' + w.pid + '\',\'' + w.sid + '\');navigate(\'wishlist\')">إزالة</button></div></div>';
    });
    container.innerHTML += '</div>';
}

// ==================== إشعارات محلية (Local Notifications) ====================
function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') showToast('تم تفعيل الإشعارات ✅');
        });
    }
}

function sendLocalNotification(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png' });
    }
}
window.addEventListener('beforeinstallprompt', function(event) {
    event.preventDefault();
    deferredInstallPrompt = event;
    updateInstallButtons();
});
window.addEventListener('appinstalled', function() {
    appInstalledThisSession = true;
    deferredInstallPrompt = null;
    document.querySelectorAll('.app-promo').forEach(function(promo){ promo.remove(); });
    updateInstallButtons();
    showToast('تم تثبيت زلطن تريبول بنجاح ✅');
});

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js?v=13', { scope: './' }).then(function(registration) {
      registration.addEventListener('updatefound', function() {
        var worker = registration.installing;
        if (worker) worker.addEventListener('statechange', function() {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) showToast('يتوفر تحديث جديد، أعد فتح التطبيق لتفعيله', 'warning', 5000);
        });
      });
    }).catch(function() {});
  });
}
