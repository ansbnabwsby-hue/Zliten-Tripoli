// ==================== برنامج الولاء (Loyalty) ====================
function getLoyaltyPoints() {
    let orders = db.orders.filter(function(o) { return o.userId === currentUser.id && o.status.indexOf('تسليم') !== -1; });
    return orders.length * 10;
}

function renderLoyalty(container) {
    let points = getLoyaltyPoints();
    let level = points < 50 ? '🥉 برونزي' : points < 150 ? '🥈 فضي' : points < 300 ? '🥇 ذهبي' : '💎 بلاتيني';
    let nextLevel = points < 50 ? 50 : points < 150 ? 150 : points < 300 ? 300 : 500;
    let progress = Math.min((points / nextLevel) * 100, 100);
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🏆 برنامج الولاء</h3>' +
        '<div class="card card-gradient-1" style="text-align:center;">' +
        '<div style="font-size:3rem;margin-bottom:10px;">🏆</div>' +
        '<h2 style="font-size:2rem;">' + points + ' نقطة</h2>' +
        '<p style="font-size:1.1rem;margin:8px 0;">المستوى: <b>' + level + '</b></p>' +
        '<div style="background:rgba(255,255,255,0.2);border-radius:10px;height:12px;margin:12px 0;overflow:hidden;">' +
        '<div style="background:white;height:100%;border-radius:10px;width:' + progress + '%;transition:width 0.5s;"></div></div>' +
        '<p style="font-size:0.85rem;">' + (nextLevel - points) + ' نقطة للمستوى التالي</p></div>' +
        '<div class="card"><h4 style="margin-bottom:12px;">🎁 مكافآت متاحة</h4>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        (points >= 50 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(50)">🎟️ كوبون 10% (50 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>🎟️ كوبون 10% (50 نقطة) - غير متاح</button>') +
        (points >= 100 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(100)">🚚 توصيل مجاني (100 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>🚚 توصيل مجاني (100 نقطة) - غير متاح</button>') +
        (points >= 200 ? '<button class="btn btn-sm btn-success" onclick="redeemReward(200)">💰 خصم 20 د.ل (200 نقطة)</button>' : '<button class="btn btn-sm btn-ghost" disabled>💰 خصم 20 د.ل (200 نقطة) - غير متاح</button>') +
        '</div></div>' +
        '<div class="card" style="text-align:center;color:var(--text-muted);"><p>💡 تحصل على 10 نقاط مقابل كل طلب مكتمل</p></div></div>';
}

function redeemReward(cost) {
    let points = getLoyaltyPoints();
    if (points < cost) return showToast('نقاط غير كافية', 'error');
    let code = 'LOYAL' + Date.now().toString().slice(-4);
    if (!db.coupons) db.coupons = [];
    let discount = cost === 50 ? 10 : cost === 100 ? 100 : 20;
    db.coupons.push({ id: 'C' + Date.now(), name: 'مكافأة ولاء', code: code, discount: discount, active: true, type: 'loyalty' });
    sync(); showToast('تم استبدال ' + cost + ' نقطة بمكافأة! الكود: ' + code + ' 🎉');
    navigate('loyalty');
}

// ==================== العروض والتخفيضات (Deals) ====================
function renderDeals(container) {
    let deals = [];
    db.stores.forEach(function(s) {
        if (s.products) {
            s.products.forEach(function(p) {
                if (p.dealPrice && p.dealPrice < p.price) {
                    deals.push({ store: s, product: p });
                }
            });
        }
    });
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🔥 عروض اليوم</h3>';
    if (!deals.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-percentage"></i><p>لا توجد عروض حالياً</p></div></div>';
        return;
    }
    deals.forEach(function(d) {
        let discount = Math.round(((d.product.price - d.product.dealPrice) / d.product.price) * 100);
        container.innerHTML += '<div class="card animate-fade" style="display:flex;gap:12px;align-items:center;">' +
            (d.product.img ? '<img src="' + d.product.img + '" class="product-img">' : '<div class="product-img" style="background:var(--gradient-2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🔥</div>') +
            '<div style="flex:1;">' +
            '<b>' + d.product.name + '</b><br>' +
            '<small style="color:var(--text-muted)">من ' + d.store.name + '</small><br>' +
            '<span style="text-decoration:line-through;color:var(--text-muted);">' + d.product.price + ' د.ل</span> ' +
            '<span style="color:var(--success);font-weight:700;font-size:1.2rem;">' + d.product.dealPrice + ' د.ل</span> ' +
            '<span class="tag tag-danger" style="background:rgba(231,76,60,0.2);color:var(--danger);">-' + discount + '%</span></div>' +
            '<button class="btn btn-sm btn-warning" onclick="addToCart(\'' + d.store.id + '\',\'' + d.product.name.replace(/\'/g, "\\'") + '\',' + d.product.dealPrice + ',\'' + (d.product.img || '') + '\');showToast(\'تمت الإضافة للسلة\')">شراء</button></div>';
    });
    container.innerHTML += '</div>';
}

// ==================== إعادة الطلب السريع ====================
function renderQuickReorder(container) {
    let myOrders = db.orders.filter(function(o) { return o.userId === currentUser.id && o.status.indexOf('تسليم') !== -1; }).reverse().slice(0, 5);
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">🔄 إعادة الطلب السريع</h3>';
    if (!myOrders.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-history"></i><p>لا توجد طلبات سابقة</p></div></div>';
        return;
    }
    myOrders.forEach(function(o) {
        let store = db.stores.find(function(s) { return s.id === o.storeId; });
        container.innerHTML += '<div class="card animate-fade">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<b>' + (store ? store.name : 'متجر') + '</b><span style="color:var(--text-muted);font-size:0.8rem;">' + o.createdAt + '</span></div>' +
            '<div style="color:var(--text-muted);font-size:0.85rem;margin-bottom:10px;">' + o.items.map(function(i){return i.name;}).join(', ') + '</div>' +
            '<div style="display:flex;gap:8px;justify-content:space-between;align-items:center;">' +
            '<span style="color:var(--success);font-weight:700;">' + (o.total || 0) + ' د.ل</span>' +
            '<button class="btn btn-sm btn-primary" onclick="reorder(\'' + o.id + '\')"><i class="fas fa-redo"></i> إعادة الطلب</button></div></div>';
    });
    container.innerHTML += '</div>';
}

function reorder(orderId) {
    let order = db.orders.find(function(o) { return o.id === orderId; });
    if (!order) return;
    cart = JSON.parse(JSON.stringify(order.items));
    updateCartBadge();
    showToast('تم نسخ المنتجات للسلة 🛒');
    navigate('cart');
}

// ==================== مشاركة المتجر ====================
function shareStore(storeId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    if (!store) return;
    let text = 'تفضل بزيارة متجر ' + store.name + ' على زلطن تريبول! 🚀';
    if (navigator.share) {
        navigator.share({ title: store.name, text: text, url: window.location.href });
    } else {
        if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + window.location.href).then(function() { showToast('تم نسخ رابط المتجر 📋'); });
        else showToast(text);
    }
}

// ==================== QR Code للمتجر (محاكاة) ====================
function showStoreQR(storeId) {
    let store = db.stores.find(function(s) { return s.id === storeId; });
    if (!store) return;
    showModal("📱 QR Code - " + store.name, '<div style="text-align:center;"><div style="width:200px;height:200px;background:var(--card);border:2px solid var(--primary);border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:4rem;">📱</div><p style="margin-top:12px;color:var(--text-muted);">امسح الكود للدخول للمتجر مباشرة</p><button class="btn btn-sm btn-outline" style="margin-top:8px;width:auto;" onclick="shareStore(\'' + storeId + '\')"><i class="fas fa-share-alt"></i> مشاركة</button></div>');
}

// ==================== إحصائيات السائق الشهرية ====================
function renderDriverStats(container) {
    if (currentUser.type !== 'driver') return navigate('driver');
    let myDeliveries = db.orders.filter(function(o) { return o.driverId === currentUser.id && o.status.indexOf('تسليم') !== -1; });
    let monthlyRevenue = {};
    myDeliveries.forEach(function(o) {
        let month = o.createdAt ? o.createdAt.split('/')[1] + '/' + o.createdAt.split('/')[2] : 'غير معروف';
        monthlyRevenue[month] = (monthlyRevenue[month] || 0) + (o.total || 0);
    });
    let totalDeliveries = myDeliveries.length;
    let totalEarnings = myDeliveries.reduce(function(s, o) { return s + (o.total || 0); }, 0);
    let avgPerDelivery = totalDeliveries ? (totalEarnings / totalDeliveries).toFixed(1) : 0;

    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">📊 إحصائياتي</h3>' +
        '<div class="grid-2" style="margin-bottom:16px;">' +
        '<div class="stat-card"><div class="stat-value">' + totalDeliveries + '</div><div class="stat-label">📦 إجمالي التوصيلات</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + totalEarnings + '</div><div class="stat-label">💰 إجمالي الأرباح</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + avgPerDelivery + '</div><div class="stat-label">📊 متوسط الطلب</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + (currentUser.ratingCount || 0) + '</div><div class="stat-label">⭐ عدد التقييمات</div></div></div>' +
        '<div class="card"><h4 style="margin-bottom:12px;">📈 الأرباح الشهرية</h4>' +
        Object.keys(monthlyRevenue).map(function(m) {
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">' +
                '<span>' + m + '</span><span style="color:var(--success);font-weight:700;">' + monthlyRevenue[m] + ' د.ل</span></div>';
        }).join('') || '<p style="color:var(--text-muted)">لا بيانات كافية</p>' +
        '</div></div>';
}

// ==================== المفضلة للمنتجات (Wishlist) ====================
let wishlist = JSON.parse(localStorage.getItem('z_wishlist') || '[]');

function toggleWishlist(productId, storeId) {
    let idx = wishlist.findIndex(function(w) { return w.pid === productId && w.sid === storeId; });
    if (idx > -1) { wishlist.splice(idx, 1); showToast('تم الإزالة من قائمة الأمنيات'); }
    else { wishlist.push({ pid: productId, sid: storeId, date: Date.now() }); showToast('تم الإضافة لقائمة الأمنيات 💙'); }
    localStorage.setItem('z_wishlist', JSON.stringify(wishlist));
}

function renderWishlist(container) {
    container.innerHTML = '<div class="animate-fade"><h3 style="margin-bottom:16px;">💙 قائمة الأمنيات</h3>';
    if (!wishlist.length) {
        container.innerHTML += '<div class="empty-state"><i class="fas fa-bookmark"></i><p>لا توجد منتجات محفوظة</p></div></div>';
        return;
    }
    wishlist.forEach(function(w) {
        let store = db.stores.find(function(s) { return s.id === w.sid; });
        let product = store && store.products ? store.products.find(function(p) { return p.id === w.pid; }) : null;
        if (!product) return;
        container.innerHTML += '<div class="card animate-fade" style="display:flex;gap:12px;align-items:center;">' +
            (product.img ? '<img src="' + product.img + '" class="product-img">' : '<div class="product-img" style="background:var(--gradient-1);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📦</div>') +
            '<div style="flex:1;"><b>' + product.name + '</b><br><small style="color:var(--text-muted)">من ' + (store ? store.name : 'متجر') + '</small><br>' +
            '<span style="color:var(--success);font-weight:700;">' + product.price + ' د.ل</span></div>' +
            '<div style="display:flex;gap:8px;flex-direction:column;">' +
            '<button class="btn btn-sm btn-primary" onclick="addToCart(\'' + w.sid + '\',\'' + product.name.replace(/\'/g, "\\'") + '\',' + product.price + ',\'' + (product.img || '') + '\');showToast(\'تمت الإضافة\')">شراء</button>' +
            '<button class="btn btn-sm btn-ghost" onclick="toggleWishlist(\'' + w.pid + '\',\'' + w.sid + '\');navigate(\'wishlist\')">إزالة</button></div></div>';
    });
    container.innerHTML += '</div>';
}

// ==================== إشعارات محلية (Local Notifications) ====================
function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') showToast('تم تفعيل الإشعارات ✅');
        });
    }
}

function sendLocalNotification(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png' });
    }
}
window.addEventListener('beforeinstallprompt', function(event) {
    event.preventDefault();
    deferredInstallPrompt = event;
    updateInstallButtons();
});
window.addEventListener('appinstalled', function() {
    deferredInstallPrompt = null;
    showToast('تم تثبيت زلطن تريبول بنجاح ✅');
});
// ==================== تحديث navigate ليشمل الصفحات الجديدة ====================

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(registration) {
      registration.addEventListener('updatefound', function() {
        var worker = registration.installing;
        if (worker) worker.addEventListener('statechange', function() {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) showToast('يتوفر تحديث جديد، أعد فتح التطبيق لتفعيله', 'warning', 5000);
        });
      });
    }).catch(function() {});
  });
}
</script>
